<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:dark}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta charset="utf-8">
<title>W Attitude 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Kanit:wght@600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b0a0c;--bg2:#141216;--bg3:#1d1a1f;--ink:#f3eee9;--mut:#9b929a;--line:#2a262c;
  --red:#e01e4a;--red2:#ff3b6f;--gold:#d4aa33;--gold2:#8a6d1c;
  --shadow:0 14px 40px rgba(0,0,0,.55);
  --display:"Anton","Kanit",Impact,"Arial Narrow",sans-serif;--cond:"Barlow Condensed","Kanit","Arial Narrow",sans-serif;
  --body:"Noto Sans Thai","Kanit",system-ui,sans-serif;--mono:"IBM Plex Mono","Noto Sans Thai",Consolas,monospace
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--body)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img{display:block}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
/* nav */
.nav{position:sticky;top:0;z-index:30;background:#000;border-bottom:3px solid var(--red)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:64px}
.logo{display:flex;align-items:center;height:44px;cursor:pointer}
.logo svg{height:44px;width:auto}
.nav a.l{font:600 15px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:22px 2px;border-bottom:3px solid transparent;margin-bottom:-3px;cursor:pointer;white-space:nowrap}
.nav a.l.on,.nav a.l:hover{border-color:var(--red)}
.nav .sp{flex:1}
.nav input{font:400 14px var(--body);background:#1a181c;color:#fff;border:1px solid #333;border-radius:3px;padding:8px 12px;width:210px}
.lang{display:flex;border:1px solid #444;border-radius:3px;overflow:hidden}
.lang button{font:600 12px var(--cond);letter-spacing:.14em;background:transparent;color:#aaa;border:0;padding:7px 10px;cursor:pointer}
.lang button.on{background:var(--red);color:#fff}
/* ticker */
.ticker{display:flex;background:#000;border-bottom:1px solid var(--line)}
.ticker .tag{background:var(--red);color:#fff;font:700 15px/1 var(--cond);letter-spacing:.16em;padding:14px 22px;white-space:nowrap;display:flex;align-items:center}
.ticker .txt{padding:10px 20px;display:flex;align-items:center;gap:14px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
.ticker .txt b{font:600 12px var(--mono);color:var(--mut);letter-spacing:.1em}
/* hero */
.hero{position:relative;margin:22px 0;background:#000 center 20%/cover no-repeat;border:1px solid var(--line);min-height:560px;display:flex;align-items:flex-end}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,12,.05) 30%,rgba(11,10,12,.92) 100%),linear-gradient(90deg,rgba(11,10,12,.85) 0,transparent 55%)}
.hero .txt{position:relative;padding:40px 44px;display:flex;flex-direction:column;gap:12px;max-width:720px}
.hero.single{display:grid;grid-template-columns:1fr 1.1fr;background:var(--bg2);min-height:0}
.hero.single::before{display:none}
.hero.single .pic{position:relative;min-height:520px;background:#000 center top/cover no-repeat}
.hero.single .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,var(--bg2) 100%)}
.hero.single .txt{padding:36px 40px;justify-content:center;max-width:none}
.kick{font:500 12px var(--mono);letter-spacing:.22em;color:var(--red2);text-transform:uppercase}
.hero h1{font:400 54px/1.05 var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hero p{margin:0;color:#d8d0cc;max-width:56ch}
.cta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{font:700 14px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;background:var(--red);color:#fff;border:0;padding:13px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;border:1px solid #555;color:#fff}
.btn:hover{filter:brightness(1.12)}
/* section heads */
.sh{display:flex;align-items:baseline;gap:16px;margin:36px 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.sh h2{font:400 26px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.sh .sub{color:var(--mut);font-size:13px}
.sh .more{margin-left:auto;font:600 13px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--red2);cursor:pointer}
/* segment strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.seg{background:var(--bg2);border:1px solid var(--line);padding:0 0 10px;position:relative}
.seg .top{height:70px;background:linear-gradient(135deg,#1e1a22,#0e0c10);display:flex;align-items:center;justify-content:center;font-size:28px;border-bottom:2px solid var(--red)}
.seg .dur{position:absolute;top:6px;left:6px;background:#000;color:#fff;font:500 11px var(--mono);padding:2px 6px}
.seg .n{font:700 14px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px 2px}
.seg .j{font-size:12px;color:var(--mut);padding:0 10px;line-height:1.45}
.seg .c{font:500 10px var(--mono);color:var(--gold);padding:6px 10px 0;letter-spacing:.08em}
/* roster */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{font:600 13px var(--cond);letter-spacing:.1em;text-transform:uppercase;background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:7px 12px;cursor:pointer;border-left:4px solid var(--cc,#555)}
.chip.on{background:var(--cc,#555);color:#fff;border-color:var(--cc,#555)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pc{position:relative;aspect-ratio:4/5;background:#000 center top/cover no-repeat;cursor:pointer;border:1px solid var(--line);overflow:hidden;transition:transform .12s}
.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.92) 100%)}
.pc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pc .t{position:absolute;left:12px;right:12px;bottom:12px;z-index:1}
.pc .nm{font:400 22px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:#fff}
.pc .nk{font:500 11px var(--mono);color:var(--gold);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .g{position:absolute;top:0;left:0;height:5px;width:100%;background:var(--gc);z-index:1}
.pc .lock{position:absolute;top:10px;right:10px;background:#000;color:var(--gold);font:500 11px var(--mono);padding:3px 7px;z-index:1}
.pc .bicon{position:absolute;top:10px;left:10px;font-size:18px;z-index:1;filter:drop-shadow(0 1px 2px #000)}
.pc:focus-visible{outline:2px solid var(--red2)}
/* storyline cards */
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ln{background:var(--bg2);border:1px solid var(--line);border-top:5px solid var(--lc);padding:14px 16px}
.ln .id{font:400 34px/1 var(--display);color:var(--lc)}
.ln h3{margin:6px 0 6px;font:700 17px/1.25 var(--cond);letter-spacing:.05em;text-transform:uppercase}
.ln p{margin:0;font-size:13px;color:#cfc6c3}
.ln .who{display:flex;margin-top:10px;flex-wrap:wrap}
.ln .who img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--bg2);margin-left:-8px;cursor:pointer}
.ln .who img:first-child{margin-left:0}
/* weeks */
.weeks{display:grid;gap:12px}
.wk{background:var(--bg2);border:1px solid var(--line)}
.wk .h{display:flex;align-items:baseline;gap:14px;padding:14px 18px;cursor:pointer;flex-wrap:wrap}
.wk .num{font:400 34px/1 var(--display);color:var(--red2);min-width:130px}
.wk .num small{display:block;font:500 11px var(--mono);color:var(--mut);letter-spacing:.06em;margin-top:4px;text-transform:none}
.wk h3{font:400 24px/1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.02em}
.wk .hook{flex-basis:100%;color:#e8e0dc;font-size:14px;border-left:3px solid var(--red);padding-left:10px;margin-top:4px}
.wk .rec{margin-left:auto;font:500 11px var(--mono);color:var(--mut)}
.wk .run{padding:0 18px 16px;border-top:1px solid var(--line)}
.wk ol{margin:12px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}
.wk li{display:grid;grid-template-columns:34px 1fr;gap:10px;font-size:13.5px;color:#e0d8d4;align-items:baseline}
.wk li b{font:500 11px var(--mono);color:var(--gold);letter-spacing:.08em}
.wk .closer{margin-top:12px;font-size:13px;color:var(--mut);border-top:1px dotted var(--line);padding-top:10px}
.wk .closer b{color:var(--red2);font:600 11px var(--mono);letter-spacing:.12em}
/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);background:var(--bg2)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.rule{background:var(--bg2);border:1px solid var(--line);padding:12px 14px;font-size:13px}
.rule b{display:block;font:700 15px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
/* titles/factions */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.belt{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center;background:var(--bg2);border:1px solid var(--gold2);padding:16px}
.belt img{width:110px;height:138px;object-fit:cover;object-position:top;border:3px solid var(--gold);cursor:pointer}
.belt h3{margin:0;font:400 28px/1 var(--display);letter-spacing:.02em}
.belt .hold{font:500 12px var(--mono);color:var(--gold);margin:6px 0}
.belt p{margin:4px 0 0;color:var(--mut);font-size:13px}
.fac{background:var(--bg2);border:1px solid var(--line);border-top:5px solid var(--fc);padding:16px}
.fac h3{margin:0 0 4px;font:400 24px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.fac .note{color:#cfc6c3;font-size:13px;margin-bottom:8px}
.fac .ten{font:500 11px var(--mono);color:var(--red2);margin-bottom:10px}
.fac .mem{display:flex;flex-wrap:wrap;gap:8px}
.mchip{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;cursor:pointer}
.mchip img{width:28px;height:28px;border-radius:50%;object-fit:cover}
/* profile */
.prof{display:grid;grid-template-columns:420px 1fr;gap:34px;margin:24px 0}
.prof .poster{border:2px solid var(--gold2);outline:1px solid #000;box-shadow:var(--shadow);aspect-ratio:4/5;background:#000 center top/cover no-repeat;position:relative}
.prof .poster .g{position:absolute;left:0;top:0;width:8px;height:100%;background:var(--gc)}
.prof .sect h3{font:400 30px/1 var(--display);color:var(--gold);letter-spacing:.03em;text-transform:uppercase;margin:24px 0 8px;position:relative;padding-bottom:8px}
.prof .sect h3::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:linear-gradient(90deg,var(--gold) 0,transparent 80%)}
.prof .sect h3:first-child{margin-top:0}
.prof .sect p{margin:0 0 12px;max-width:68ch;color:#e6ddd8;font-size:15px}
.nameblock{background:var(--bg2);border:1px solid var(--line);padding:22px 24px;margin-top:22px;display:grid;gap:18px}
.big{font:400 52px/.95 var(--display);text-transform:uppercase;letter-spacing:.01em}
.big span{display:block;color:var(--red2)}
.nick{font:700 19px var(--cond);color:var(--gold);letter-spacing:.06em;margin:8px 0 2px}
.thai{color:var(--mut);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;margin:0;align-content:start}
.kv dt{font:600 11px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding-top:3px;white-space:nowrap}
.kv dd{margin:0;color:#e6ddd8}
.persona{display:grid;gap:8px}
.persona div{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--gold);padding:10px 14px;font-size:14px;color:#e6ddd8}
.engine{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.eng{background:var(--bg2);border:1px solid var(--line);padding:12px 14px;font-size:13px}
.eng b{display:block;font:600 11px var(--mono);letter-spacing:.18em;color:var(--red2);margin-bottom:4px}
.radarwrap{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:center;background:var(--bg2);border:1px solid var(--line);padding:16px}
.statlist{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px}
.statlist div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:3px 0}
.statlist b{font:500 14px var(--mono);color:var(--red2)}
.rels{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.rels li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:14px}
.tag{font:500 11px var(--mono);letter-spacing:.06em;padding:2px 8px;color:#fff;background:var(--tc);white-space:nowrap}
.rels a{text-decoration:underline dotted;cursor:pointer}
.tl{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:13px}
.tl li{display:grid;grid-template-columns:80px 1fr;gap:10px}
.tl li b{font:500 11px var(--mono);color:var(--mut)}
.pn{display:flex;justify-content:space-between;margin:30px 0 10px;gap:10px}
.pn a{font:700 14px var(--cond);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--mut)}
.pn a:hover{color:#fff}
.crumb{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:18px 0 0}
.crumb a{cursor:pointer;color:var(--red2)}
/* relationship chart */
.chartbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);padding:12px 16px;margin-bottom:10px}
.chartbar input[type=range]{flex:1;min-width:220px;accent-color:var(--red)}
.chartbar .wl{font:400 22px/1 var(--display);color:var(--red2);min-width:160px}
.chartbar .wl small{display:block;font:500 11px var(--mono);color:var(--mut);letter-spacing:.06em;margin-top:3px}
.chartbar select{font:400 13px var(--body);background:#1a181c;color:#fff;border:1px solid #333;padding:6px 8px;max-width:260px}
.mapwrap{background:var(--bg2);border:1px solid var(--line);padding:10px;overflow-x:auto}
svg.graph text{font-family:var(--body);fill:var(--ink)}
.node{cursor:pointer}
.node circle{fill:var(--bg2);stroke-width:3}
.node.dim{opacity:.18}
.edge{fill:none;stroke-width:2.2;opacity:.6}
.edge.dim{opacity:.06}
.edge.hot{opacity:1;stroke-width:3.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--lc);vertical-align:middle;margin-right:6px}
.evlist{margin-top:14px;display:grid;gap:4px;font-size:13px}
.evlist div{display:grid;grid-template-columns:80px auto 1fr;gap:10px;align-items:baseline}
.evlist b{font:500 11px var(--mono);color:var(--mut)}
/* episodes */
.eplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.epcard{background:var(--bg2);border:1px solid var(--line);cursor:pointer;display:grid;grid-template-rows:auto 1fr;transition:transform .15s}
.epcard:hover{transform:translateY(-3px);border-color:var(--red)}
.epcard .cv{aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
.epcard .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.epcard .cv .slate{position:absolute;inset:0;background:linear-gradient(135deg,#1a1418,#0b0a0c 60%,#2a0d15);display:flex;align-items:center;justify-content:center;font:400 72px/1 var(--display);color:#3b3038;letter-spacing:.04em}
.epcard .cv .num{position:absolute;left:14px;top:12px;font:400 30px/1 var(--display);color:#fff;text-shadow:0 2px 12px #000}
.epcard .cv .dt{position:absolute;right:12px;bottom:10px;font:500 11px var(--mono);color:#fff;background:rgba(0,0,0,.6);padding:3px 8px;letter-spacing:.06em}
.epcard .b{padding:14px 16px 16px}
.epcard h3{font:400 28px/1 var(--display);margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
.epcard .m{color:var(--mut);font-size:13px}
.epcard .st{display:flex;gap:14px;margin-top:10px;font:500 11px var(--mono);color:var(--mut);letter-spacing:.05em;flex-wrap:wrap}
.epcard .st b{color:var(--gold)}
.epcard.soon{opacity:.55;cursor:default}
.ep{max-width:1100px;margin:0 auto}
.ep .hd{padding:26px 0 18px;border-bottom:3px solid var(--red);margin-bottom:6px}
.ep .hd .kick{font:600 12px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--red2)}
.ep .hd h1{font:400 clamp(44px,7vw,84px)/.95 var(--display);margin:6px 0 10px;text-transform:uppercase;letter-spacing:.01em}
.ep .hd .meta{font:500 12px var(--mono);color:var(--mut);letter-spacing:.05em}
.ep .intro{margin:16px 0 0;display:grid;gap:8px}
.ep .intro div{border-left:3px solid var(--gold2);padding:4px 14px;color:#d8d0cc;font-size:14px}
.ep .rail{position:sticky;top:64px;z-index:20;background:rgba(11,10,12,.97);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 8px}
.ep .rail::-webkit-scrollbar{display:none}
.ep .rail a{font:600 12px var(--cond);letter-spacing:.1em;color:var(--mut);border:1px solid var(--line);padding:5px 10px;white-space:nowrap;cursor:pointer;text-transform:uppercase}
.ep .rail a:hover,.ep .rail a.on{color:#fff;border-color:var(--red);background:#1c0e14}
.seq{padding:34px 0 8px;border-bottom:1px solid var(--line)}
.seq .sh2{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.seq .sh2 .no{font:400 46px/1 var(--display);color:var(--red2);letter-spacing:.02em}
.seq .sh2 h2{font:400 30px/1.05 var(--display);margin:0;text-transform:uppercase;letter-spacing:.02em}
.seq .sh2 .em{font-size:26px}
.seq .smeta{font:500 12px/1.7 var(--mono);color:var(--mut);margin:8px 0 18px;letter-spacing:.03em}
.seq .smeta b{color:var(--gold)}
.scr{max-width:100%}
.scr .act,.scr .dl,.scr .gl,.scr .cm{max-width:76ch}
.scr .shot{font:600 13px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:26px 0 8px;padding-top:12px;border-top:1px dashed #2f2a33;display:flex;gap:10px;align-items:baseline}
.scr .shot .n{font:400 22px/1 var(--display);color:#fff}
.scr .act{color:#e6dfdb;font-size:15px;margin:0 0 10px}
.scr .dl{margin:0 0 4px;padding-left:18px}
.scr .dl .who{font:600 13px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--red2);margin-right:8px}
.scr .dl .who small{font:400 11px var(--body);text-transform:none;letter-spacing:0;color:var(--mut)}
.scr .dl .en{color:#fff;font-size:15.5px}
.scr .gl{margin:0 0 12px;padding-left:18px;color:var(--mut);font-size:13.5px;font-style:italic}
.scr .cm{margin:6px 0 10px;padding:8px 14px;background:#111014;border-left:3px solid #3b3540;font-size:14px}
.scr .cm .who{color:#9fb6c8}
.fig{margin:22px 0 30px}
.fig img{width:100%;height:auto;display:block;background:#000;aspect-ratio:16/9;object-fit:cover}
.fig figcaption{display:flex;gap:12px;align-items:baseline;padding:10px 2px 0;font-size:13px;color:#cfc6c2;line-height:1.5}
.fig figcaption code{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.fig figcaption .tg{font:600 10px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:#fff;border-left:2px solid var(--red);padding-left:6px;white-space:nowrap}
.fig figcaption .tg.v{border-color:#5b8ec9}
.fig.pend{margin:14px 0 18px;padding:9px 14px;border:1px dashed #3a3340;background:#0e0d10;display:flex;gap:12px;align-items:baseline;font-size:12.5px;color:#7d7380}
.fig.pend code{font-family:var(--mono);font-size:11px;color:#8a7f8c;white-space:nowrap}
.fig.pend .w{font:600 10px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:#5a4f58;white-space:nowrap}
.stills{margin:28px 0 22px}
.stills .lab{font:600 12px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;gap:10px;align-items:center}

r lies.\""}, "theme": {"th": "synth K-POP กระแทกสี่จังหวะ คนดูร้อง hook เอง", "en": "Four-on-the-floor K-pop synth; the crowd sings the hook"}}, "stats": {"flex": 93, "power": 68, "exp": 58, "stam": 80, "tech": 74, "burst": 92, "trick": 85, "mind": 77}, "want": {"th": "ให้ทั้งโลกยอมรับว่าเธอคือ \"หน้าของ W\" เพราะคนดูเลือก — ไม่ใช่เพราะบอร์ดเลือก", "en": "To be called the face of W because the crowd chose her — not because a boardroom did"}, "flaw": {"th": "หัวร้อน + ego — โดนหยามแล้วก่อเรื่องก่อนคิด ให้บริษัทมีข้ออ้างลงโทษทุกสัปดาห์", "en": "Hot head and a big ego — insult her and she swings before she thinks, handing the office an excuse to punish her every week"}, "bit": {"th": "ขยิบตาให้ hard cam · ทุกสัปดาห์ทำอะไรสักอย่างใส่ \"ทรัพย์สินบริษัท\" (poster ป้าย รถ)", "en": "The wink at the hard cam · every week something happens to \"company property\" (a poster, a sign, a car)"}, "look": {"th": "ผมดำยาวลอนธรรมชาติ · E-cup เอวคอด S-curve · ชุดปล้ำ: one-piece แดง metallic ขอบขาว คอ V halter + ปลอกแขนแดง + สนับเข่าแดง + boots เชือกขาว", "en": "Long natural black waves · full-figured S-curve · gear: red metallic one-piece with white trim, V halter, red arm sleeves, red knee pads, white lace-up boots"}, "voice": {"public": {"th": "ประโยคสั้น จบด้วยมุก พูดกับกล้องมากกว่าคู่กรณี · ยิ่งโกรธยิ่งยิ้ม", "en": "Short lines that end on a joke, delivered to the camera more than the opponent · the angrier she gets, the wider she smiles"}, "private": {"th": "พูดเร็ว ค้างกลางประโยค ถามซ้ำว่า \"ฉันทำถูกมั้ย\" กับ BiBi คนเดียว", "en": "Fast, unfinished sentences; asks \"did I do the right thing?\" — only to BiBi"}}, "s1": {"th": "คนดูเลือกเธอเป็น THE FACE ด้วยเสียง · ยังไม่มีเข็มขัด · ชิงสิทธิ์ท้า W Crown ที่ W CLIMAX", "en": "The crowd's pick for THE FACE · no title yet · fighting for the W Crown shot at W CLIMAX"}, "bio": [{"h": "FROM THE CAGE", "p": {"th": "สามปีที่ Mai เต้นอยู่ในกรงข้างเวที เธอไม่ใช่นักปล้ำ เธอคือ \"ของประดับ\" ที่โชว์จ้างมาให้คนดูมีอะไรมองระหว่างเปลี่ยนฉาก แต่ต chorus สังเคราะห์", "en": "K-idol hook with a synthetic chorus"}}, "stats": {"flex": 86, "power": 62, "exp": 64, "stam": 72, "tech": 80, "burst": 78, "trick": 88, "mind": 58}, "want": {"th": "ถูก **รัก** ไม่ใช่ถูก **เลือก**", "en": "To be **loved**, not **chosen**"}, "flaw": {"th": "ยอมรับไม่ได้ว่าตัวเอง petty · ร้องไห้ก่อน แล้วค่อยวางแผนร้าย", "en": "Can't admit she's petty · cries first, schemes second"}, "bit": {"th": "\"ยิ้ม idol ที่หล่นหนึ่งวินาที\" กล้องจับได้ทุกสัปดาห์ · ซ่อน Teddy", "en": "The idol smile that drops for exactly one second — the camera catches it every week · hiding Teddy"}, "look": {"th": "idol เกาหลี ผิวขาว บ๊อบสั้น · ชุดปล้ำ: one-piece ดำเงาขอบทอง เส้นทองที่เอว boots ดำเชือกทอง ต่างหูห่วงทองเล็ก (corporate ดำ-ทอง) · ยิ้มสำเร็จรูป", "en": "Korean idol, pale skin, short bob · gear: sleek black one-piece with gold trim and a gold belt-line, black boots with gold laces, small gold hoops (corporate black-and-gold) · a factory-perfect smile"}, "voice": {"public": {"th": "สุภาพเกินจริง ลงท้ายด้วยรอยยิ้ม · ไม่เคยด่าใครตรง ๆ แต่ทุกคำมีหนาม", "en": "Over-polite, every line ends in a smile · never insults anyone directly, every word has a thorn"}, "private": {"th": "พูดเร็ว ให้ข้อมูลเกิน คำสั่งจริงมาท้ายสุด · กับ Teddy เท่านั้นที่เสียงตก", "en": "Fast, over-explains, the real request comes last · her voice only drops with Teddy"}}, "s1": {"th": "THE FACE ที่บอร์ดเลือกด้วยตัวเลข · Teddy เป็นแฟนลับ · Reira จับตาเป็นว่าที่ศิษย์", "en": "The board's THE FACE, chosen by the numbers · Teddy is her secret · Reira is watching her as a possible protégée"}, "bio": [{"h": "CHOSEN BY THE NUMBERS", "p": {"th": "Dahae มาถึง W พร้อมยอด follower มากกว่าทั้ง roster รวมกัน Shiori ดูกราฟแล้วเลือกเธอเป็น THE FACE ก่อนที่เธอจะขึ้นปล้ำแมตช์แรก ปัญหาคือคนในสนามไม่ได้ดูกราฟ — พวกเขาตะโกนชื่อ Mai ทับเพลงเปิดตัวของเธอ Dahae ยิ้ม idol ค้างไว้จนกล้องตัด แล้วร้องไห้ในห้องแต่งตัวสามนาที ก่อนจะเช็ดหน้าแล้วถามผู้ช่วยว่า \"clip นั้นลบได้มั้ย\"", "en": "Dahae arrived at W with more followers than the entire roster combined. Shiori looked at the graph and made her THE FACE before she'd had a single match. The problem: the people in the building don't read graphs. They chanted Mai's name over her entrance music. Dahae held the idol smile until the camera cut, cried in the dressing room for three minutes, wiped her face and asked her assistant, \"Can that clip be deleted?\""}}, {"h": "THE SMILE THAT DROPS", "p": {"th": "เธอไม่ใช่คนเลว — เธอคือคนที่อยากถูกรักมากจนยอมทำเรื่องเล็ก ๆ ที่น่าเกลียด แล้วเกลียดตัวเองที่ทำ กล้องจับ \"ยิ้มที่หล่นหนึ่งวินาที\" ของเธอได้ทุกสัปดาห์ และคนดูเล่นเกมจับจังหวะนั้น เธอทำงานกับกล้องเก่งพอ ๆ กับ Mai แต่ใช้มันซ่อนแทนที่จะใช้มันโจมตี และของที่เธอซ่อนชื่อ Teddy — ผู้ช่วยส่วนตัวที่บริษัทห้ามไม่ให้เป็นอะไรมากกว่านั้น", "en": "She isn't evil. She's someone who wants to be loved so badly she'll do small ugly things, then hate herself for doing them. The camera catches her smile dropping for one second every week, and the fans have made a game of spotting it. She works a camera as well as Mai does — but she uses it to hide instead of to attack. What she's hiding is named Teddy, the personal assistant the company forbids from being anything more."}}, {"h": "SEASON ONE — LOVED OR CHOSEN", "p": {"th": "Dahae ต้องพิสูจน์ว่าตัวเลขชนะเสียงคนดูได้ ทุกสัปดาห์เธอได้แมตช์ที่บริษัทจัดให้ชนะ และทุกสัปดาห์เสียงโห่ดังขึ้น Reira แชมป์ Crimson Rose มองเธอเป็นว่าที่ศิษย์ — หรือคนที่จะฝังเธอ ส่วน Ren Kageyama มองเธอเป็นของเล่นชิ้นใหม่ ปมของซีซั่น: วันที่บอร์ดเลิกเลือกเธอ จะเหลือใครรักเธอบ้าง", "en": "Dahae has to prove the numbers can beat the noise. Every week the office hands her a match she's booked to win, and every week the boos get louder. Reira, the Crimson Rose champion, sees her as a possible successor — or the one who'll bury her. Ren Kageyama sees her as a new toy. The question of the season: the day the board stops choosing her, who's left to love her?"}}], "rel": [{"to": "mai-ino", "type": "rival", "note": {"th": "คู่แข่ง THE FACE", "en": "Rival for THE FACE"}}, {"to": "teddy", "type": "love", "note": {"th": "แฟนลับ ซ่อนไม่มิด", "en": "Secret boyfriend, badly hidden"}}, {"to": "shiori-kageyama", "type": "boss", "note": {"th": "ตัวเลขของ Shiori", "en": "Shiori's number"}}, {"to": "tachibana-reira", "type": "wants", "note": {"th": "อยากได้การยอมรับจากแชมป์", "en": "Wants the champion's approval"}}, {"to": "ren-kageyama", "type": "hides", "note": {"th": "ลูกชายเจ้าของจีบเธอ — เธอปฏิเสธไม่ได้และรับไม่ได้", "en": "The owner's son is courting her — she can't say no and can't say yes"}}], "kind": "wrestler", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/min-dahae_face.jpg", "poster": "img/min-dahae_poster.jpg", "hero": true}, {"slug": "juri", "name": "Juri", "thai": "จูริ", "group": "women", "gender": "f", "align": {"th": "Face → ? (slow burn)", "en": "Face → ? (slow burn)"}, "nick": {"th": "\"Fan #1\"", "en": "\"Fan #1\""}, "persona": [{"th": "แฟนคลับแถวหน้าที่โดดข้ามแผงกั้นมาช่วย idol ของตัวเอง แล้วได้สัญญา", "en": "The front-row fan who jumped the barricade to save her idol and got a contract for it"}, {"th": "รัก = ครอบครอง · ทุกสัปดาห์เหมือน Mai มากขึ้นหนึ่งอย่าง", "en": "Love means ownership · every week she becomes one more piece of Mai"}, {"th": "เทคนิคแน่นกว่าที่หน้าตาบอก — ซ้อมท่าจาก clip มาสองปี", "en": "Far better in the ring than she looks — two years of drilling moves off clips"}], "vitals": {"height": {"th": "160 cm", "en": "5'3\""}, "frm": {"th": "แถวหน้าสุดของทุก show W มา 2 ปี", "en": "Front row of every W show for two years"}, "style": {"th": "Technical scrappy · เลียนท่า Mai ได้เกือบเหมือน", "en": "Scrappy technician · copies Mai's moves almost perfectly"}, "debut": {"th": "Season 1 Week 1 — โดดข้ามแผงกั้นมาช่วย Mai", "en": "Season 1 Week 1 — jumped the barricade to save Mai"}, "finisher": {"th": "MIRROR — springboard moonsault แบบเดียวกับ Mai แต่ไม่บิดตัว (\"เกือบเหมือน\")", "en": "MIRROR — Mai's springboard moonsault without "สองปีที่ Juri นั่งแถวหน้าสุดทุก show ถือป้ายชื่อ Mai ตั้งแต่ตอน Mai ยังเป็นแค่นักเต้นในกรง คืนที่ Mai ถูกรุมข้างเวที Juri โดดข้ามแผงกั้นมาช่วยทั้งที่ไม่มีใครขอ กล้องจับได้ และ Sune เซ็นสัญญาให้เธอในสัปดาห์ถัดมาด้วยเหตุผลข้อเดียว: \"คนดูชอบ\" ไม่มีใครถามว่าเธอปล้ำเป็นมั้ย — ปรากฏว่าเป็น เพราะเธอซ้อมท่าของ Mai มาสองปีจาก clip", "en": "Two years in the front row of every show, holding a sign with Mai's name back when Mai was just the girl in the cage. The night Mai got jumped at ringside, Juri hopped the barricade and waded in without anyone asking. The camera caught it, and Sune signed her the following week for one reason: \"the crowd likes her.\" Nobody asked whether she could wrestle. Turns out she could — she'd been drilling Mai's moves off clips for two years."}}, {"h": "ONE THING A WEEK", "p": {"th": "เธอไม่ได้อยากเป็นเหมือน Mai เธออยากให้ Mai มองเธอคนเดียว และวิธีเดียวที่เธอรู้คือกลายเป็นสิ่งที่ Mai มองในกระจก สัปดาห์แรกเป็นเสื้อ สัปดาห์ต่อมาเป็นทรงผม แล้วก็ขยิบตา แล้วก็ท่า คนดูเล่นเกมทายทุกสัปดาห์ว่าเธอ copy อะไร และหัวเราะ — จนสัปดาห์ที่ไม่มีใครหัวเราะ Tora พยายามจีบเธอทุกสัปดาห์ และเธอมองทะลุเขาไปที่ Mai ทุกครั้ง", "en": "She doesn't want to be like Mai. She wants Mai to look at her and nobody else, and the only way she knows how is to become what Mai sees in the mirror. Week one it's the top. Then the hair. Then the wink. Then the moves. The fans guess what she copied each week and laugh — until the week nobody laughs. Tora tries to get her attention every single show, and every single show she looks straight through him at Mai."}}, {"h": "SEASON ONE — SLOW BURN", "p": {"th": "ทั้งซีซั่น Juri คือคนที่ช่วย Mai ทุกครั้งที่ Mai ถูกรุม เธอไม่เคยแพ้แมตช์เมื่อ Mai ยืนข้างเวที และไม่เคยชนะเมื่อ Mai ไม่อยู่ ตะขอของซีซั่น: วันที่ Mai หันไปกอดคนอื่นก่อน — Sune? Kaito? คนดู? — Juri จะทำอะไร", "en": "All season long, Juri is the one who saves Mai every time Mai gets swarmed. She has never lost with Mai at ringside and never won without her. The hook of the season: the day Mai hugs someone else first — Sune? Kaito? the crowd? — what does Juri do?"}}], "rel": [{"to": "mai-ino", "type": "wants", "note": {"th": "อยากเป็นคนเดียวที่ Mai มอง → กลายเป็น Mai", "en": "Wants to be the only one Mai sees → becomes Mai"}}, {"to": "tora", "type": "love", "note": {"th": "เขาจีบ เธอมองทะลุ — ทะเลาะ คืนดี วนลูป", "en": "He chases, she looks through him — fight, make up, repeat"}}], "kind": "wrestler", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/juri_face.jpg", "poster": "img/juri_poster.jpg", "hero": true}, {"slug": "suji", "name": "Suji", "thai": "ซูจี", "group": "women", "gender": "f", "align": {"th": "Face daredevil", "en": "Face daredevil"}, "nick": {"th": "\"Up! Up!\"", "en": "\"Up! Up!\""}, "persona": [{"th": "นักยิมนาสติกที่ถูกตัดชื่อเพราะทำท่าที่โค้ชไม่ได้สั่ง", "en": "A gymnast cut from the national team for doing the move the coach didn't call"}, {"th": "ปีนของที่ไม่ควรปีนทุกสัปดาห์ · ยอมเจ็บเพื่อ moment เดียว", "en": "Climbs something she shouldn't every week · will take the pain for one moment"}, {"th": "หลงผู้ชายผิดคน และรู้ตัวดี", "en": "In love with the wrong man, and fully aware of it"}], "vitals": {"height": {"th": "170 cm", "en": "5'7\""}, "frm": {"th": "ทีมชาติยิมนาสติกที่ถูกตัดชื่อ → W", "en": "Cut from the national gymnastics team → W"}, "style": {"th": "High-risk aerial · ไม่มีท่าพื้น", "en": "High-risk aerial · has no ground game and doesn't want one"}, "debut": {"th": "Season 1 Week 1 — โดนให้คะแนน 0 จาก THE STANDARD กลางเวที", "en": "Season 1 Week 1 — scored a 0 by THE STANDARD in the ring"}, "finisher": {"th": "FREEFALL — swanton จากที่สูงที่สุดที่หาได้ในคืนนั้น", "en": "FREEFALL — swanton from the highest thing in the building that night"}, "sigs": [{"th": "Barricade moonsault", "en": "Barricade moonsault"}, {"th": "Ladder-top crossbody", "en": "Ladder-top crossbody"}, {"th": "Hurricanrana จากเชือกเส้นบน", "en": "Top-rope hurricanrana"}], "entrance": {"th": "วิ่งลง ramp ไม่หยุด slide เข้าเวที ปีนเชือกทันที ชูสองนิ้วขึ้นฟ้า", "en": "Sprints the ramp, slides in, climbs the ropes immediately, two fingers to the sky"}, "catch": {"th": "(ไม่มีคำพูด — เธอมองขึ้น คนดูตะโกน \"UP! UP!\")", "en": "(No words — she looks up, the crowd chants \"UP! UP!\")"}, "theme": {"th": "drum and bass เร็ว + เสียงคนดู UP UP", "en": "Fast drum and bass with the crowd's UP UP baked in"}}, "stats": {"flex": 95, "power": 65, "exp": 60, "stam": 85, "tech": 70, "burst": 96, "trick": 88, "mind": 82}, "want": {"th": "ให้คนจำเธอในฐานะ **คนที่กล้าที่สุด** ไม่ใช่สวยที่สุด", "en": "To be remembered as the **bravest**, not the prettiest"}, "flaw": {"th": "บ้าระห่ำ + ชอบผู้ชายผิดคน (Kenzo)", "en": "Reckless, and in love with the wrong man (Kenzo)"}, "bit": {"th": "ปีนอะไรสักอย่างที่ไม่ควรปีนทุกสัปดาห์ · เธอมองขึ้น = คนดูตะโกน \"UP! UP!\"", "en": "Climbs something she shouldn't every week · she looks up, the crowd chants \"UP! UP!\""}, "look": {"th": "นักกีฬาแข็งแรง ผมยาวปล่อย · one-piece ลายทางกรมท่า-ขาว + ผ้าพันข้อมือขาว + boots กลางน่อง · รอยยิ้มก่อนกระโดด", "en": "Athletic build, long loose hair · navy-and-white striped one-piece, white wrist tape, mid-calf boots · the smile right before she jumps"}, "voice": {"public": {"th": "พูดน้อย หัวเราะก่อนตอบ · ตอบคำถามด้วยการกระทำ", "en": "Few words, laughs before answering · answers questions with actions"}, "private": {"th": "พูดตรง หยาบนิด ๆ · เรื่อง Kenzo คือเรื่องเดียวที่เลี่ยง", "en": "Blunt, a little crude · Kenzo is the only subject she dodges"}}, "s1": {"th": "High flyer ของ roster · feud กับ THE STANDARD ตั้งแต่ Week 1 · Kenzo ยืนดูเธอโดนรุม", "en": "The roster's high flyer · feuding with THE STANDARD since Week 1 · Kenzo watches her get jumped and does nothing"}, "bio": [{"h": "CUT FROM THE TEAM", "p": {"th": "Suji เคยเป็นนักยิมนาสติกทีมชาติจนถูกตัดชื่อเพราะ \"ทำท่าที่โค้ชไม่ได้สั่ง\" ในรอบชิง เธอเอาความบ้าระห่ำนั้นมาที่ W และคืนแรกก็ปีนขึ้นกรงนักเต้นแล้วกระโดดใส่คนสองคนข้างล่าง คนดูไม่รู้จักชื่อเธอ แต่จำได้ว่าเธอกระโดดจากไหน THE STANDARD ให้คะแนนหน้าตาเธอเป็น 0 กลางเวที และนั่นคือความผิดพลาดที่ใหญ่ที่สุดของแก๊ง", "en": "Suji was a national-team gymnast until she got cut for \"doing the move the coach didn't call\" in a final. She brought that recklessness to W, and on her first night climbed the dancers' cage and jumped onto two people below. The crowd didn't know her name, but they remembered where she jumped from. THE STANDARD held up a 0 for her face in the middle of the ring — the biggest mistake the group has ever made."}}, {"h": "LOOK UP", "p": {"th": "ทุกสัปดาห์ Suji ปีนอะไรสักอย่างที่ไม่ควรปีน — โต๊ะพากย์ กรง บันไดเหล็ก ป้าย LED เธอไม่มีท่าพื้น ไม่มี promo ยาว มีแค่รอยยิ้มก่อนกระโดดที่ทำให้ทั้งสนามลุกขึ้นยืน จุดตายของเธอไม่ใช่ความสูง มันคือ Kenzo — มือของ Ren Kageyama ที่ยืนดูเธอโดนรุมโดยไม่ช่วย แล้วเธอยังมองเขา", "en": "Every week Suji climbs something she shouldn't: the announce table, the cage, a ladder, the LED board. No ground game, no long promos, just the smile before the jump that puts the whole building on its feet. Her weak spot isn't the height. It's Kenzo — Ren Kageyama's muscle, who stands there with his hands in his pockets while she gets swarmed, and she still looks at him."}}, {"h": "SEASON ONE — ZERO", "p": {"th": "Suji vs THE STANDARD ที่ให้คะแนนเธอ 0 เธอไม่ได้สู้เพื่อพิสูจน์ว่าสวย — เธอสู้เพื่อให้แก๊งต้องกลัวเวลาเธอมองขึ้น ระหว่างทาง Kenzo จะต้องเลือกสักครั้งว่าจะยืนดูหรือจะลงมือ และไม่ว่าเลือกทางไหน Suji จะเจ็บ", "en": "Suji versus the gang that scored her a zero. She isn't fighting to prove she's pretty — she's fighting so that the next time she looks up, they flinch. Somewhere along the way Kenzo will have to choose between watching and acting, and whichever way he chooses, Suji gets hurt."}}], "rel": [{"to": "kenzo", "type": "love", "note": {"th": "ผู้ชายผิดคน", "en": "The wrong man"}}, {"to": "tasha-volkova", "type": "rival", "note": {"th": "ถูกให้คะแนน 0", "en": "Scored a 0"}}, {"to": "mai-ino", "type": "ally", "note": {"th": "พันธมิตรฝั่งเสียงคนดู", "en": "Ally on the crowd's side"}}, {"to": "daiji", "type": "ally", "note": {"th": "ซ้อมที่โกดังของ Daiji", "en": "Trains at Daiji's warehouse"}}], "kind": "wrestler", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/suji_face.jpg", "poster": "img/suji_poster.jpg", "hero": true}, {"slug": "akari-noa", "name": "Akari Noa", "thai": "อาคาริ โนอา", "group": "women", "gender": "f", "align": {"th": "Heel enforcer ของบริษัท", "en": "The office's enforcer"}, "nick": {"th": "\"The Ninth Wonder\"", "en": "\"The Ninth Wonder\""}, "persona": [{"th": "bodyguard ของตระกูลเจ้าของที่ตัวใหญ่กว่าผู้ชายในตึกครึ่งหนึ่ง", "en": "The owner family's bodyguard, bigger than half the men in the building"}, {"th": "ไม่ขายความสวย และดูถูกคนที่ขาย", "en": "Doesn't sell sex appeal and looks down on anyone who does"}, {"th": "ทำตามคำสั่งมาทั้งชีวิต — จนวันที่ไม่ทำ", "en": "Has followed orders her whole life — until the day she doesn't"}], "vitals": {"height": {"th": "180 cm", "en": "5'11\""}, "frm": {"th": "ยูโดทีมชาติ → bodyguard ตระกูล Kageyama → สังเวียน", "en": "National judo team → Kageyama family bodyguard → the ring"}, "style": {"th": "Powerhouse · ท่าจับทุ่ม", "en": "Powerhouse · throws"}, "debut": {"th": "Season 1 Week 1 — เดินลงมาเปลี่ยนผลแมตช์ตามคำสั่ง Shiori", "en": "Season 1 Week 1 — walked down and changed a result on Shiori's orders"}, "finisher": {"th": "VERDICT — powerbomb ยกค้างสามวินาทีให้กล้อง", "en": "VERDICT — powerbomb, held up three full seconds for the camera"}, "sigs": [{"th": "Gorilla press โยนออกนอกเวที", "en": "Gorilla press over the top rope"}, {"th": "Face-rip — ดึงเครื่องประดับ/ชุดของคู่ต่อสู้ออก", "en": "Face-rip — tears off the opponent's jewellery or gear"}, {"th": "Military press ใส่ผู้ชาย", "en": "Military press on a man"}], "entrance": {"th": "ไม่มีไฟพิเศษ เดินลงมาระหว่างแมตช์คนอื่นเสมอ · พากย์: \"นี่มันไม่ใช่แมตช์ของเธอ!\"", "en": "No lights — she always walks down during somebody else's match · commentary: \"This isn't her match!\""}, "catch": {"th": "\"Say 'female' one more time.\"", "en": "\"Say 'female' one more time.\""}, "theme": {"th": "เบสหนักจังหวะเดินทหาร", "en": "Heavy bass in a marching rhythm"}}, "stats": {"flex": 55, "power": 97, "exp": 75, "stam": 88, "tech": 78, "burst": 70, "trick": 60, "mind": 85}, "want": {"th": "ให้ถูกนับเป็น \"นักสู้\" ไม่ใช่ \"นักสู้หญิง\"", "en": "To be counted as a fighter, not a female fighter"}, "flaw": {"th": "ดูถูกผู้หญิงที่ขายความสวยจนประเมินต่ำ · Kenzo = ประตูหลัง", "en": "Underrates anyone who trades on looks · Kenzo is her back door"}, "bit": {"th": "ทุกสัปดาห์เอาที่ของผู้ชายหนึ่งคน (แทรกแมตช์ชาย / ตบผู้ชาย / นั่งเก้าอี้เขา) · \"ฉีกหน้ากาก\" = ทำอะไรกับหน้า/ชุดคู่ต่อสู้เสมอ", "en": "Every week she takes a man's place (interrupts a men's match, slaps a man, sits in his chair) · always does something to the opponent's face or gear"}, "look": {"th": "สูงกว่าทุกคนหนึ่งหัว ไหล่กว้าง · บ๊อบดำอสมมาตร หน้าม้ายาว ปาก burgundy · one-piece ทอง metallic ตาข่ายดำ boots ดำสูง", "en": "A head taller than everyone, broad shoulders · asymmetric black bob with long bangs, burgundy lips · gold metallic one-piece, black fishnet, tall black boots"}, "voice": {"public": {"th": "ประโยคสั้นมาก ไม่เกินหกคำ · ไม่ตะโกน", "en": "Six words or fewer · never shouts"}, "private": {"th": "พูดยาวขึ้นเฉพาะกับ Kenzo แล้วเกลียดตัวเองที่พูด", "en": "Only talks in full sentences to Kenzo, and hates herself for it"}}, "s1": {"th": "มือของ Shiori · อดีตของ Kenzo ยังลุกไหม้ · เริ่มลังเลกลางซีซั่น", "en": "Shiori's hand · the old fire with Kenzo still burns · starts hesitating mid-season"}, "bio": [{"h": "THE BODYGUARD", "p": {"th": "ก่อนจะมีสังเวียน Akari ยืนอยู่หลังเก้าอี้ของ Reiji Kageyama ในฐานะ bodyguard ที่ไม่มีใครกล้าถามว่าทำไมผู้หญิง เธอเป็นยูโดทีมชาติที่ทุ่มผู้ชายได้ตั้งแต่อายุสิบหก Shiori ดึงเธอลงมาข้างเวทีในคืนที่ต้องการให้ผลแมตช์เปลี่ยน และตั้งแต่นั้นทุกครั้งที่ Akari เดินลง ramp คนดูรู้ว่าแมตช์จบแล้ว — ไม่ว่ากรรมการจะรู้หรือไม่", "en": "Before the ring, Akari stood behind Reiji Kageyama's chair as the bodyguard nobody dared ask about. National judo team, throwing grown men since sixteen. Shiori brought her to ringside the night a result needed changing, and ever since, when Akari walks the ramp the crowd knows the match is over — whether or not the referee does."}}, {"h": "NOT A FEMALE WRESTLER", "p": {"th": "เธอไม่ได้เกลียด Mai เพราะ Mai สวย เธอเกลียดเพราะ Mai ทำให้คนเรียกทั้ง division ว่า \"สาว ๆ\" ทุกสัปดาห์เธอเอาที่ของผู้ชายหนึ่งคน — แทรกแมตช์ชาย นั่งเก้าอี้พากย์ของ Dex ตบ Kenzo — เพื่อพิสูจน์ว่าคำว่า \"หญิง\" ไม่ต้องนำหน้าชื่อเธอ จุดตายคือคนเดียวที่เห็นเธอเป็นผู้หญิง คือ Kenzo อดีตที่ยังไม่จบ และเขารู้วิธีใช้มัน", "en": "She doesn't hate Mai for being pretty. She hates that Mai makes people call the whole division \"the girls.\" Every week she takes a man's spot — interrupts a men's match, sits in Dex's chair, slaps Kenzo — to prove the word \"female\" doesn't belong in front of her name. Her weak spot is the one man who sees her as a woman: Kenzo, the ex that never ended, and he knows exactly how to use it."}}, {"h": "SEASON ONE — THE HAND THAT TURNS", "p": {"th": "Akari เริ่มซีซั่นในฐานะมือของ Shiori และจะจบซีซั่นในฐานะคนที่ปฏิเสธคำสั่งกลางสนามเป็นครั้งแรก ทางเดินระหว่างนั้นคือการค่อย ๆ เห็นว่าคนที่เธอดูถูกว่าขายความสวย รับหมัดได้มากกว่าคนที่สั่งเธอ", "en": "Akari starts the season as Shiori's hand and ends it as the woman who refuses an order in the middle of the ring for the first time. The road between is watching the girl she dismissed as eye candy take more punishment than the people giving the orders ever could."}}], "rel": [{"to": "shiori-kageyama", "type": "enforcer", "note": {"th": "ทำตามคำสั่ง", "en": "Follows orders"}}, {"to": "kenzo", "type": "love", "note": {"th": "อดีตรักเป็นพิษ ยังลุกไหม้", "en": "Toxic ex; still burning"}}, {"to": "mai-ino", "type": "rival", "note": {"th": "ดูถูกว่าขายความสวย", "en": "Dismisses her as eye candy"}}, {"to": "dex-malone", "type": "rival", "note": {"th": "ยึดเก้าอี้พากย์ของเขา Week 1", "en": "Took his chair on Week 1"}}], "kind": "wrestler", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/akari-noa_face.jpg", "poster": "img/akari-noa_poster.jpg", "hero": true}, {"slug": "bibi", "name": "BiBi", "thai": "บีบี 🇹🇭", "group": "women", "gender": "f", "align": {"th": "Face · เพื่อนแท้ของ Mai", "en": "Face · Mai's best friend"}, "nick": {"th": "\"Wrong Time, Right Dance\"", "en": "\"Wrong Time, Right Dance\""}, "persona": [{"th": "เต้น trend กลางเหตุการณ์ที่ไม่ควรเต้น แล้วทั้งสนามเต้นตาม", "en": "Does the trending dance in the middle of a crisis, and the whole building joins in"}, {"th": "มือถือไม่เคยวาง — cold open ของแทบทุก show มาจากกล้องเธอ", "en": "Never puts the phone down — almost every cold open comes from her camera"}, {"th": "ฉลาดกว่าที่มุกบอก อ่านห้องได้เร็วที่สุดในตึก", "en": "Smarter than the bit — reads a room faster than anyone in the building"}], "vitals": {"height": {"th": "158 cm", "en": "5'2\""}, "frm": {"th": "Bangkok → Cage Dancer corps", "en": "Bangkok → the Cage Dancer corps"}, "style": {"th": "Comedy scrapper · ท่าเต้นเป็นท่าปล้ำ", "en": "Comedy scrapper · dance moves become wrestling moves"}, "debut": {"th": "Season 1 Week 1 — cold open จากมือถือของเธอ", "en": "Season 1 Week 1 — the cold open from her phone"}, "finisher": {"th": "TREND — ท่าเต้นที่จบด้วย roll-up (ชนะเพราะคู่ต่อสู้งง)", "en": "TREND — a dance that ends in a roll-up (wins because the opponent is confused)"}, "sigs": [{"th": "Selfie-elbow", "en": "Selfie elbow"}, {"th": "Dance-dodge", "en": "Dance dodge"}, {"th": "ถ่ายคู่ต่อสู้แล้วโดนตบ", "en": "Films the opponent and gets slapped for it"}], "entrance": {"th": "เต้น trend ล่าสุดลง ramp · คนดูทำท่าตาม · Mai ทำหน้าเบื่อแต่ยิ้ม", "en": "Dances the latest trend down the ramp · crowd copies · Mai rolls her eyes and smiles"}, "catch": {"th": "\"Wait— is this live?\"", "en": "\"Wait— is this live?\""}, "theme": {"th": "เพลง trend ที่เปลี่ยนทุกสัปดาห์", "en": "Whatever's trending that week"}}, "stats": {"flex": 88, "power": 50, "exp": 48, "stam": 82, "tech": 60, "burst": 80, "trick": 92, "mind": 90}, "want": {"th": "ให้คนเห็นว่าเธอฉลาด ไม่ใช่แค่ตลก", "en": "To be seen as smart, not just funny"}, "flaw": {"th": "ทำ trend ผิดเวลาที่สุดเสมอ", "en": "Impeccably wrong timing, every time"}, "bit": {"th": "เต้น trend กลางเหตุการณ์ร้ายแรง · มือถือของเธอคือกล้องที่เห็นทุกอย่าง", "en": "Dances through disasters · her phone is the camera that sees everything"}, "look": {"th": "สาวไทย Cage Dancer ยิ้มทั้งตัว ชุดเต้นสีสด · มือถือติดมือ", "en": "Thai Cage Dancer who smiles with her whole body, bright dance gear · phone welded to her hand"}, "voice": {"public": {"th": "ไทยปนอังกฤษ พูดเร็ว หัวเราะเอง · ถามคำถามที่ทุกคนคิดแต่ไม่ถาม", "en": "Thai-English mix, fast, laughs at her own jokes · asks the question everyone's thinking"}, "private": {"th": "คนเดียวที่พูดกับ Mai ตรง ๆ ว่า \"เธอผิด\"", "en": "The only person who tells Mai \"you're wrong\" to her face"}}, "s1": {"th": "Cage Dancer corps · เพื่อนคนเดียวที่ Mai ไม่ต้องแสดง · ชนะเข็มขัด 24/7 โดยบังเอิญ Week 5", "en": "Cage Dancer corps · the one friend Mai never performs for · accidentally wins the 24/7 title in Week 5"}, "bio": [{"h": "THE PHONE THAT SEES EVERYTHING", "p": {"th": "BiBi มาจาก Bangkok เข้า corps รุ่นเดียวกับ Mai และเป็นคนเดียวที่ Mai ไม่ต้องแสดงด้วย มือถือของเธอไม่เคยวาง และมันเห็นทุกอย่าง — cold open ของแทบทุก show มาจาก clip ที่เธอถ่ายไว้โดยไม่ตั้งใจ เธอเต้น trend ผิดเวลาที่สุดเสมอ: กลางงานแถลง กลางแมตช์ กลางคำสั่งของ CEO และคนดูรักเธอเพราะอย่างนั้น", "en": "BiBi came from Bangkok in the same corps class as Mai, and she's the only person Mai doesn't perform for. Her phone never goes down and it sees everything — nearly every cold open is a clip she shot by accident. Her timing is flawlessly wrong: she'll dance through a press conference, a match, a CEO's order. The crowd loves her for exactly that."}}, {"h": "SMARTER THAN THE BIT", "p": {"th": "สิ่งที่คนไม่เห็นคือ BiBi อ่านห้องได้เร็วที่สุดในตึก เธอรู้ว่าใครโกหกก่อนใคร และเธอเลือกทำตลกเพราะคนตลกไม่ถูกลงโทษ ปมของเธอ: อยากให้สักคนมองว่าเธอฉลาด — และคนนั้นคือ Mai ที่ยุ่งเกินกว่าจะมอง", "en": "What nobody sees is that BiBi reads a room faster than anyone in the building. She knows who's lying before anyone else does, and she plays the clown because clowns don't get punished. What she wants is for one person to see that she's smart — and that person is Mai, who's too busy to look."}}, {"h": "SEASON ONE — THE WITNESS", "p": {"th": "BiBi คือคนที่ยืนข้าง Mai ทุกครั้งที่ทุกคนหันหลัง เธอไม่ได้ปล้ำเก่ง แต่ชนะด้วย roll-up ที่คู่ต่อสู้งง (และคว้าเข็มขัด 24/7 ได้สามนาที) และเมื่อถึงเวลาที่ Mai ต้องฟังความจริง คนที่พูดคือเธอ", "en": "BiBi is the one standing next to Mai every time everyone else turns around. She isn't a great wrestler, but she wins with roll-ups that leave opponents baffled (and holds the 24/7 title for three whole minutes). And when the time comes for Mai to hear the truth, she's the one who says it."}}], "rel": [{"to": "mai-ino", "type": "ally", "note": {"th": "เพื่อนแท้", "en": "Best friend"}}, {"to": "madam-karasu", "type": "rival", "note": {"th": "เคยถือเข็มขัดของเธอ 3 นาที", "en": "Held her title for three minutes"}}], "kind": "wrestler", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/bibi_face.jpg", "poster": "img/bibi_poster.jpg", "hero": true}, {"slug": "yue-m", "name": "YUE M", "thai": "ยูเอะ เอ็ม", "group": "women", "gender": "f", "align": {"th": "Monster", "en": "Monster"}, "nick": {"th": "\"The Asset\"", "en": "\"The Asset\""}, "persona": [{"th": "ทรัพย์สินที่เจ้าของเก็บไว้ในที่ที่ไม่มีใครถาม — จนลูกสาวขอปล่อย", "en": "An asset the owner kept somewhere nobody asked about — until his daughter asked to release it"}, {"th": "นิ่งแล้วน่ากลัวกว่าขยับ · พูดหนึ่งคำต่อสัปดาห์", "en": "Scarier still than moving · one word per week"}, {"th": "ทำตามคำสั่ง — จนกว่าจะไม่ทำ", "en": "Follows orders าวินาที ไฟกลับมา เธอยืนอยู่กลางเวที และตั้งแต่นั้นทุกครั้งที่ไฟกระพริบ ทั้งสนามเงียบ", "en": "On the company's books she has no name, only a code. Reiji kept her somewhere nobody asked about, until Shiori asked her father to \"release\" her to deal with Mai — and he agreed, on terms nobody knows yet. Week 2, the lights went out mid-match for five seconds. When they came back she was standing in the ring, and ever since, every flicker of the lights silences the building."}}, {"h": "ONE WORD", "p": {"th": "เธอพูดหนึ่งคำต่อสัปดาห์ และคำนั้นคือสิ่งที่คนดูถกกันจนถึงสัปดาห์หน้า เธอทำตามคำสั่งของ Shiori — จนกว่าจะไม่ทำ คำถามของซีซั่นไม่ใช่ว่าเธอแข็งแค่ไหน แต่คือ Shiori ควบคุมเธอได้จริงไหม และถ้าไม่ ใครควบคุม", "en": "She says one word a week, and that word is what the fans argue about until the next show. She follows Shiori's orders — until she doesn't. The question of the season isn't how strong she is. It's whether Shiori actually controls her, and if not, who does."}}, {"h": "SEASON ONE — RELEASED", "p": {"th": "เธอคืออาวุธของเส้นหลัก และเป็นตัวแปรที่ทำให้ทุกฝ่ายกลัวเท่ากัน ปลายซีซั่นเธอจะทำสิ่งที่ไม่มีใครสั่ง และคนที่ต้องรับผิดชอบคือคนที่ขอปล่อย", "en": "She's the weapon of the main storyline and the variable every side fears equally. By the end of the season she'll do something nobody ordered — and the person who has to answer for it is the one who asked to release her."}}], "rel": [{"to": "shiori-kageyama", "type": "enforcer", "note": {"th": "ของที่ Shiori ขอพ่อปล่อย", "en": "The asset Shiori asked her father to release"}}, {"to": "kaito", "type": "wants", "note": {"th": "เล็งเขาเป็นหมากทำลาย Mai", "en": "Eyes him as the piece to break Mai with"}}], "kind": "wrestler", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/yue-m_face.jpg", "poster": "img/yue-m_poster.jpg", "hero": true}, {"slug": "alice-otsu", "name": "Alice Otsu", "thai": "อลิซ โอสึ", "group": "women", "gender": "f", "align": {"th": "Face underdog", "en": at slips is usually her own group's business."}}, {"h": "SEASON ONE — FIRST", "p": {"th": "ทั้งซีซั่น Roxy คือคนที่แซะ Mai ทุกสัปดาห์แล้วต้องยิ้มกว้างที่สุดเวลาต้องยืนข้าง Mai ในงานบริษัท ปมของเธอ: วันที่ Tasha ให้คะแนนเธอต่ำกว่า Mai", "en": "All season she trashes Mai on Monday and smiles beside her at the company photo shoot on Friday. Her reckoning: the day Tasha scores her lower than Mai."}}], "rel": [{"to": "tasha-volkova", "type": "ally", "note": {"th": "หัวหน้า", "en": "Her leader"}}, {"to": "mai-ino", "type": "rival", "note": {"th": "แซะทุกสัปดาห์", "en": "Trashes her every week"}}], "kind": "wrestler", "gender": "f", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/roxy-lane_face.jpg", "poster": "img/roxy-lane_poster.jpg", "hero": true}, {"slug": "kanna", "name": "Kanna", "thai": "คันนะ", "group": "women", "align": {"th": "Heel · กำลังของ THE STANDARD", "en": "Heel · the muscle of THE STANDARD"}, "nick": {"th": "\"The Muscle\"", "en": "\"The Muscle\""}, "persona": [{"th": "นักปล้ำที่ดีที่สุดในแก๊ง และไม่มีใครรู้ เพราะเธอยืนหลังสุดตอนถ่ายรูป", "en": "The best wrestler in the group and nobody knows, because she stands at the back of every photo"}, {"th": "ทำงานสกปรกทุกชิ้นด้วยเทคนิคที่สะอาดที่สุด", "en": "Does every dirty job with the cleanest technique in the building"}, {"th": "\"Yes, Tasha.\" — จนวันที่ไม่พูด", "en": "\"Yes, Tasha.\" — until the day she doesn't say it"}], "vitals": {"height": {"th": "162 cm", "en": "5'4\""}, "frm": {"th": "ยูโดมัธยม → Tasha เก็บมาเพราะ \"ทำงานเงียบ\"", "en": "High-school judo → picked up by Tasha because she \"works quiet\""}, "style": {"th": "Technical grappler · ทำงานสกปรกเก่ง", "en": "Technical grappler · very good at dirty work"}, "debut": {"th": "Season 1 Week 1 — คนที่ลงมือแทนแก๊ง", "en": "Season 1 Week 1 — the one who does it for the group"}, "finisher": {"th": "ORDER — fisherman suplex (ท่าที่ Tasha สั่ง)", "en": "ORDER — fisherman suplex (the move Tasha calls)"}, n the roster."}}, {"h": "YES, TASHA", "p": {"th": "เธอรู้ว่าคำสั่งบางคำผิด และเธอทำ ไม่ใช่เพราะกลัว แต่เพราะยังไม่มีใครบอกว่าเธอเก่งพอจะไม่ต้องทำ ปมของเธอคือการยอมรับ — จากใครก็ได้ที่ไม่ใช่ Tasha", "en": "She knows some of the orders are wrong, and she does them anyway — not out of fear, but because nobody has told her yet that she's good enough not to. What she needs is recognition, from anyone who isn't Tasha."}}, {"h": "SEASON ONE — THE THIRD MEMBER", "p": {"th": "Kanna คือคนที่จะเปลี่ยนสมการของ THE STANDARD ในครึ่งหลังของซีซั่น วันที่เธอปล้ำชนะแบบสะอาดแล้ว Tasha ไม่มอง คือวันที่แก๊งเริ่มแตก", "en": "Kanna is the one who changes THE STANDARD's math in the back half of the season. The day she wins clean and Tasha doesn't even look up is the day the group starts to crack."}}], "rel": [{"to": "tasha-volkova", "type": "ally", "note": {"th": "หัวหน้า", "en": "Her leader"}}, {"to": "alice-otsu", "type": "rival", "note": {"th": "ชนะเธอ Week 3 — และจำ kick out ทั้งสี่ครั้งได้", "en": "Beat her in Week 3 — and remembers all four kick-outs"}}], "kind": "wrestler", "gender": "f", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/kanna_face.jpg", "poster": "img/kanna_poster.jpg", "hero": true}, {"slug": "kamiya-rei", "name": "Kamiya Rei", "thai": "คามิยะ เรย์", "group": "women", "align": {"th": "Corporate champion", "en": "Corporate champion"}, "nick": {"th": "\"The Empress\"", "en": "\"The Empress\""}, "persona": [{"th": "แชมป์ที่บริษัทประกาศ แล้วไม่เคยลงมาป้องกัน — นั่งดูจากกล่อง VIP ทุก show", "en": "A champion the company announced and who has never come down to defend — she watches every show from the VIP box"}, {"th": "เทคนิคดีที่สุดใน roster และไม่เคยต้องใช้", "en": "The best technician on the roster who has never had to prove it"}, {"th": "เบื่อจนประมาท — และคนดูรอวันที่เธอลงบันได", "en": "Bored to the point of carelessness — and the crowd is waiting for the day she takes the stairs"}], "vitals": {"height": {"th": "172 cm", "en": "5'8\""}, "frm": {"th": "แชมป์ที่บริษัทประกาศแล้วไม่เคยลงมา", "en": "The champion the office declared, who never came down"}, "style": {"th": "Striker แม่น · ท่าน้อย · ไม่เคยเหนื่อยเพราะไม่เคยปล้ำนาน", "en": "Precision striker · few moves · never tired because she's never gone long"}, "debut": {"th": "Season 1 Week 1 — นั่งดูจากกล่อง VIP", "en": "Season 1 Week 1 — watching from the VIP box"}, "finisher": {"th": "CORONATION — roundhouse kick แล้วนั่งทับอกกดนับแบบไม่ลุก", "en": "CORONATION — roundhouse kick, then a seated cover she doesn't get up from"}, "sigs": [{"th": "Slap ครั้งเดียวไม่ซ้ำ", "en": "One slap, never twice"}, {"th": "เดินหนีขณะคู่ต่อสู้ยังไม่ล้ม", "en": "Walks away before the opponent hits the mat"}, {"th": "ยกเข็มขัดจากกล่อง VIP ให้กล้อง", "en": "Raises the belt from the box for the camera"}], "entrance": {"th": "(ยังไม่มี — ทั้งซีซั่นเธออยู่ในกล่อง VIP · เพลงเธอเปิดครั้งแรกคืน W CLIMAX)", "en": "(none yet — she stays in the box all season · her music plays for the first time at W CLIMAX)"}, "catch": {"th": "\"Come up and take it.\"", "en": "\"Come up and take it.\""}, "theme": {"th": "organ โบสถ์ + เบสต่ำ", "en": "Church organ over sub-bass"}}, "stats": {"flex": 70, "power": 82, "exp": 90, "stam": 60, "tech": 93, "burst": 80, "trick": 75, "mind": 58}, "want": {"th": "ครองต่อไปโดยไม่ต้องลงมาเปื้อน", "en": "To keep the belt without ever getting dirty"}, "flaw": {"th": "เบื่อจนประมาท", "en": "Bored into carelessness"}, "bit": {"th": "นั่งดูจากกล่อง VIP ไม่เคยลงมา คนดูรอวันที่เธอลง", "en": "Watches from the VIP box and never comes down; the crowd waits"}, "look": {"th": "บ๊อบดำเรียบระดับกราม ต่างหูทองห้อย · ชุดปล้ำ: leotard satin ดำไหล่เดียวร้อยเชือกแดง · ชุด VIP: ดำ-แดงเข้ม", "en": "Sleek jaw-length black bob, gold drop earrings · gear: black satin one-shoulder leotard laced in red · VIP look: black and deep red"}, "voice": {"public": {"th": "ไม่พูด · ยกเข็มขัดแทน", "en": "Doesn't speak · raises the belt instead"}, "private": {"th": "พูดกับเข็มขัด", "en": "Talks to the belt"}}, "s1": {"th": "👑 W Crown champion · รางวัลของ THE FACE", "en": "👑 W Crown champion · the prize of THE FACE"}, "bio": [{"h": "THE BOX", "p": {"th": "Rei ได้เข็มขัด W Crown ในคืนที่บริษัทประกาศว่าเธอคือแชมป์ และตั้งแต่นั้นเธอนั่งดูทุก show จากกล่อง VIP ชั้นสอง ไม่ลงมา ไม่ป้องกัน ไม่พูด ยกเข็มขัดให้กล้องหนึ่งครั้งต่อคืน คนดูโห่ในเดือนแรก แล้วเริ่มรอ — เพราะทุกคนรู้ว่าวันที่เธอลงมา จะเป็นคืนที่ใหญ่ที่สุดของปี", "en": "Rei was handed the W Crown the night the office declared her champion, and she has watched every show since from the second-floor VIP box. Never comes down, never defends, never speaks. Raises the belt for the camera once a night. The crowd booed for a month, then started waiting — because everyone knows the night she finally comes down is the biggest night of the year."}}, {"h": "COME UP AND TAKE IT", "p": {"th": "เธอเก่งจริง — เทคนิคดีที่สุดใน roster และไม่เคยต้องใช้ จุดตายคือความเบื่อ: แชมป์ที่ไม่เคยเหนื่อยเพราะไม่เคยปล้ำเกินสามนาที วันที่ต้องปล้ำสิบห้านาทีกับคนที่ไม่ยอมล้ม เธอจะรู้ว่าเข็มขัดหนักแค่ไหน", "en": "She's the real thing — the best technician on the roster, and she's never needed it. Her weakness is boredom: a champion who has never been tired because she has never gone past three minutes. The day she has to go fifteen with someone who won't stay down, she'll learn how much the belt weighs."}}, {"h": "SEASON ONE — THE PRIZE", "p": {"th": "W Crown คือรางวัลของ THE FACE คืน W CLIMAX จะเป็นครั้งแรกที่เพลงของ Rei เปิด และครั้งแรกที่เธอลงบันได คำถาม: ลงมาเพื่อป้องกัน หรือลงมาเพื่อยึด", "en": "The W Crown is the prize for THE FACE. W CLIMAX will be the first time Rei's music plays and the first time she takes the stairs. The question: is she coming down to defend, or to take?"}}], "rel": [{"to": "mai-ino", "type": "rival", "note": {"th": "เป้าหมายของ Mai", "en": "Mai's target"}}, {"to": "shiori-kageyama", "type": "boss", "note": {"th": "บริษัทประกาศให้เธอเป็นแชมป์", "en": "The office declared her champion"}}, tty\" into a compliment. She's the Crimson Rose champion who actually defends every month — the opposite of Rei — and the crowd loves her because she has never pretended not to care."}}, {"h": "THE KNEE TALKS", "p": {"th": "รุ่นใหม่เร็วขึ้นทุกปี เข่าเธอเริ่มส่งเสียง และเธอยังไม่มีผู้สืบทอดที่ยอมรับได้ Dahae มีทุกอย่างยกเว้นหัวใจ Mai มีหัวใจแต่ยังไม่มีวินัย เธอยืนดูจากทางลงทุกครั้งที่สองคนนี้ปล้ำ และการปรบมือหรือไม่ปรบของเธอกลายเป็นข่าว", "en": "The new class gets faster every year, her knee has started talking, and she still has no successor she can accept. Dahae has everything except the heart. Mai has the heart and none of the discipline. She watches both of them from the entrance, and whether she applauds is the story of the week."}}, {"h": "SEASON ONE — THE MENTOR", "p": {"th": "Reira คือคนที่ทั้ง Dahae และ Mai อยากได้การยอมรับ และเธอจะให้แค่คนเดียว การเลือกของเธอจะเปลี่ยนสมการ THE FACE ในสัปดาห์ท้าย ๆ", "en": "Reira is the approval both Dahae and Mai want, and she'll only give it to one of them. Her choice reshapes THE FACE in the final weeks."}}], "rel": [{"to": "min-dahae", "type": "wants", "note": {"th": "ว่าที่ศิษย์ — หรือคนที่จะฝังเธอ", "en": "Possible heir — or the one who buries her"}}, {"to": "mai-ino", "type": "wants", "note": {"th": "เด็กที่เดินเส้นทางเดียวกับเธอ", "en": "The kid walking her old road"}}, {"to": "kamiya-rei", "type": "rival", "note": {"th": "แชมป์ที่ลงมาป้องกัน vs แชมป์ที่ไม่ลง", "en": "The champion who defends vs the one who doesn't"}}], "kind": "wrestler", "gender": "f", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/tachibana-reira_face.jpg", "poster": "img/tachibana-reira_poster.jpg", "hero": true}, {"slug": "oni-reiko", "name": "Oni Reiko", "thai": "โอนิ เรย์โกะ", "group": "women", "align": {"th": "Monster ใต้ดิน · คนใต้ดินบูชา", "en": "Underground monster · worshipped down there"}, "nick": {"th": "\"Reiko the Butcher\"", "en": "\"Reiko the Butcher\""}, "persona": [{"th": "ตำนาน is changing and chooses not to see it, because she's afraid of losing the only thing that feels like family. Their mirror pose drifts a little more out of sync every week, and the fans who look closely can tell."}}, {"h": "SEASON ONE — ONE CROWN", "p": {"th": "THE STANDARD ให้คะแนนพวกเธอ Week 4 และ Hibiki ได้ 9 Mio ได้ 10 — ตัวเลขเดียวที่ทำให้ทีมที่เข้าขาที่สุดเริ่มแตก", "en": "THE STANDARD scores them in Week 4: Hibiki gets a 9, Mio gets a 10 — the one number that starts breaking the tightest team in the company."}}], "rel": [{"to": "tasha-volkova", "type": "rival", "note": {"th": "ให้คะแนน 9 / 10 — ตัวเลขที่แยกทีม", "en": "Scored them 9 and 10 — the number that splits the team"}}], "kind": "wrestler", "gender": "f", "group_name": {"th": "Women's division", "en": "Women's division"}, "color": "#e0245e", "img": "img/neon-saints_face.jpg", "poster": "img/neon-saints_poster.jpg", "hero": true}, {"slug": "sune", "name": "Sune", "thai": "ซูเนะ", "group": "men", "align": {"th": "Face · ปากของ show และ top star สายชาย", "en": "Face · the mouth of the show and the top male star"}, "nick": {"th": "\"The Mouth of W\"", "en": "\"The Mouth of W\""}, "persona": [{"th": "คนเดียวในค่ายที่ชนะได้ทั้งบนสังเวียนและบนไมค์ — และรู้ว่าอย่างไหนขายได้มากกว่า", "en": "The only man in the company who wins in the ring and on the mic — and knows which one sells more"}, {"th": "ตั้งฉายาให้ศัตรูแล้วฉายาติดทั้งซีซั่น · คนดูพูด hook แทนเขา", "en": "Nicknames his enemies and the names stick all season · the crowd finishes his lines for him"}, {"th": "เจ้าของตั้งเขาเป็น Head of Talent ข้ามหัวลูกสาว — และเขายังลงปล้ำ main event", "en": "The owner made him Head of Talent over his own daughter — and he still main-events"}], "vitals": {"height": {"th": "186 cm", "en": "6'1\""}, "frm": {"th": "Osaka → เด็กโกดังของ Daiji → top star 8 ปี", "en": "Osaka → Daiji's warehouse → eight years as the top star"}, "style": {"th": "MMA-style striker · brawler ที่ปิดด้วย spinebuster · ไมค์คืออาวุธหลัก", "en": "MMA-style striker · brawler who closes with a spinebuster · the mic is the main weapon"}, "debut": {"th": "Season 1 Week 1 — Reiji ตั้งเป็น Head of Talent กลางเวที", "en": "Season 1 Week 1 — named Head of Talent by Reiji in the ring"}, "finisher": {"th": "SUNRISE — spinebuster ยกสูงแล้วทุ่มลงกลางเวที", "en": "SUNRISE — a high-lift spinebuster planted dead centre"}, "sigs": [{"th": "\"ข้อสาม\" ที่ไม่เคยมาถึง", "en": "The \"third thing\" that never arrives"}, {"th": "ชูโทรศัพท์ \"ประธานสั่งมา\"", "en": "Holds up the phone: \"the chairman says\""}, {"th": "Ground-and-pound ในมุมเวที (สาย MMA)", "en": "Ground-and-pound in the corner (MMA style)"}], "entrance": {"th": "ไม่มี intro — ไมค์ตัดเข้ากลางประโยคของคนอื่น แล้ว riff กีตาร์ค่อยตามมา", "en": "No intro — the mic cuts into somebody else's sentence, the guitar riff follows"}, "catch": {"th": "\"I've got three things to say.\" (คนดู: \"THERE IS NO THIRD!\")", "en": "\"I've got three things to say.\" (crowd: \"THERE IS NO THIRD!\")"}, "theme": {"th": "riff กีตาร์เดียวสั้น ๆ แล้วระเบิดเป็น rock", "en": "One short guitar riff that explodes into rock"}}, "stats": {"flex": 72, "power": 84, "exp": 92, "stam": 86, "tech": 82, "burst": 85, "trick": 80, "mind": 78}, "want": {"th": "ให้คนดูเลือกเขาทุกคืน — ไม่ใช่บอร์ด", "en": "To be the crowd's choice every night — never the board's"}, "flaw": {"th": "ปากเร็วกว่าใจ ทำพังทุกความสัมพันธ์ · ปกป้อง Mai ด้วยเหตุผลที่ไม่มีใครเชื่อ", "en": "His mouth moves faster than his heart and wrecks every relationship · protects Mai with reasons nobody believes"}, "bit": {"th": "\"ผมมีเรื่องจะพูด 3 ข้อ\" ข้อสามไม่เคยมาถึง · ตั้งฉายาให้คนที่เขาด่าและฉายาติดทั้งซีซั่น", "en": "\"I've got three things to say\" — the third never comes · nicknames stick all season"}, "look": {"th": "ชาย 38 หุ่นนักสู้ MMA กล้ามแน่น ผมสั้นเข้ม แผลเป็นบนอก รอยสักต้นแขน · look ประจำตัว (นอกสังเวียน): เสื้อยืดขาว + ยีนส์ ยิ้มเป็นมิตร — คนที่คนดูรัก ไม่ใช่ตัวร้าย · บนสังเวียน: fight shorts ลาย camo + MMA gloves ดำ + ผ้าพันมือ (ไม่ใช่ trunks)", "en": "38, MMA-fighter build, short dark hair, scar on the chest, tattoo on the upper arm · signature off-ring look: white tee and jeans, warm smile — the guy the crowd loves, not a villain · in the ring: camo fight shorts, black MMA gloves, hand wraps (never trunks)"}, "voice": {"public": {"th": "ประโยคเต็ม เร็ว มีมุก ชี้นิ้วไปที่คนที่กำลังด่า · เว้นจังหวะให้คนดูตะโกนแทน", "en": "Full sentences, fast, funny, points at whoever he's roasting · leaves gaps for the crowd to fill"}, "private": {"th": "ช้า เบา พูดค้าง · เปลี่ยนเรื่องทันทีที่ใครพูดชื่อ Mai", "en": "Slow, quiet, unfinished · changes the subject the second anyone says Mai's name"}}, "s1": {"th": "Head of Talent ที่ยังปล้ำ main event · ชนกับ Shiori ทุกสัปดาห์ · สามเหลี่ยม Mai × Sune × Kaito", "en": "Head of Talent who still main-events · collides with Shiori every week · the Mai × Sune × Kaito triangle"}, "bio": [{"h": "THE PEOPLE'S PICK", "p": {"th": "Sune ออกมาจากโกดังของ Daiji เมื่อแปดปีก่อนพร้อมท่าเดียวกับปากที่เร็วกว่าทุกคนในตึก เขาเป็น top star สายชายมาตั้งแต่นั้น — ไม่ใช่เพราะบอร์ดเลือก แต่เพราะทุกครั้งที่เพลงเขาขึ้น ทั้งสนามยืน Reiji รู้ว่าซื้อความรักแบบนั้นไม่ได้ จึงทำสิ่งเดียวที่ทำได้: ตั้งเขาเป็น Head of Talent ข้ามหัวลูกสาวตัวเอง", "en": "Sune came out of Daiji's warehouse eight years ago with one finisher and the fastest mouth in the building. He's been the top male star ever since — not because the board chose him, but because every time his music hits the whole arena stands up. Reiji knows you can't buy that kind of love, so he did the only thing he could: made Sune Head of Talent over his own daughter's head."}}, {"h": "THREE THINGS", "p": {"th": "เขาตั้งฉายาให้ทุกคนที่เขาไม่ชอบ และฉายาติดปากคนดูภายในสัปดาห์เดียว — \"คุณหนู Spreadsheet\" คือ Shiori ตั้งแต่ Week 1 เขาขึ้นเวทีพร้อมประโยคว่ามีเรื่องจะพูดสามข้อ แต่ข้อสามไม่เคยมาถึงเพราะมีคนขัดเสมอ จนคนดูตะโกนว่าไม่มีข้อสามก่อนเขาจะพูด สิ่งที่ทำให้เขาอันตรายกว่านักปล้ำคนอื่น: เขาไม่ต้องชนะแมตช์ก็ทำให้อีกฝ่ายเสียฟอร์มต่อหน้ากล้องได้ — และเขายังชนะแมตช์ด้วย", "en": "He nicknames everyone he doesn't like and the name is in the crowd's mouth within a week — \"Miss Spreadsheet\" has been Shiori since Week 1. He walks out saying he has three things to say and the third never arrives because someone always interrupts, so now the crowd chants \"there is no third\" before he even starts. What makes him more dangerous than anyone else: he can make you lose your cool on camera without winning a match — and then he wins the match too."}}, {"h": "SEASON ONE — THE VOICE OF THE CROWD", "p": {"th": "Sune คือปากของฝั่งเสียงคนดู เขาปกป้อง Mai ทุกสัปดาห์ด้วยเหตุผลที่บอกทุกคนว่าเป็นเรื่องธุรกิจ และไม่มีใครเชื่อ — ไม่มีใครเลย โดยเฉพาะ Kaito ที่ประกาศชอบ Mai ต่อหน้าทั้งสนาม ระหว่างนั้น Ryusei Kazuma แชมป์ที่บอร์ด import มาจากอเมริกา บอกว่าสายชายคือรายการหลัก และเขาคือ \"หน้าที่แท้จริงของ W\" — สงคราม ratings ชาย vs หญิงเริ่มที่สองคนนี้", "en": "Sune is the mouth of the crowd's side. He protects Mai every week with a reason he tells everyone is business, and nobody believes him — least of all Kaito, who announced his feelings for Mai to a full arena. Meanwhile Ryusei Kazuma, the champion the board imported from America, says the men are the main show and he's \"the real face of W.\" The men-versus-women ratings war starts with these two."}}], "rel": [{"to": "mai-ino", "type": "love", "note": {"th": "almost — พูดแทนเธอทั้งที่เธอไม่ได้ขอ", "en": "Almost — speaks for her without being asked"}}, {"to": "shiori-kageyama", "type": "rival", "note": {"th": "ตั้งฉายา \"คุณหนู Spreadsheet\"", "en": "Gave her the name \"Miss Spreadsheet\""}}, {"to": "reiji-kageyama", "type": "boss", "note": {"th": "ชูโทรศัพท์ \"ประธานสั่งมา\" ทุกครั้งที่ Shiori จะชนะ", "en": "Holds up the phone every time Shiori is about to win"}}, {"to": "kaito", "type": "rival", "note": {"th": "ผู้ชายอีกคนที่ Mai ฟัง", "en": "The other man Mai listens to"}}, {"to": "ryusei-kazuma", "type": "rival", "note": {"th": "ratings ชาย vs หญิง — ใครคือหน้าของ W", "en": "Men vs women ratings — who is the face of W"}}, {"to": "daiji", "type": "ally", "note": {"th": "เทรนเนอร์เก่า คนเดียวที่เขาไม่เถียง", "en": "His old trainer, the only man he doesn't argue with"}}], "kind": "wrestler", "gender": "m", "group_name": {"th": "Men's division", "en": "Men's division"}, "color": "#3b6ea5", "img": "img/sune_face.jpg", "poster": "img/sune_poster.jpg", "hero": true}, {"slug": "ryusei-kazuma", "name": "Ryusei Kazuma", "thai": "ริวเซย์ คาซึมะ", "group": "men", "align": {"th": "Heel-ace · แชมป์ที่บอร์ด import", "en": "Heel ace · the champion the board imported"}, "nick": {"th": "\"The Sovereign\"", "en": "\"The Sovereign\""}, "persona": [{"th": "ace ที่บอร์ดซื้อมาจากอเมริกาเพื่อตลาดโลก — และเขารู้ว่าซื้อ ไม่ใช่รัก", "en": "The ace the board bought from America for the global market — and he knows he was bought, not loved"}, {"th": "เชื่อว่าสายหญิงคือ show เปิดของเขา และพูดออกอากาศ", "en": "Believes the women are his opening act, and says so on air"}, {"th": "แคร์ทุกตัวเลข ทั้งที่แสดงว่าไม่แคร์อะไรเลย", "en": "Cares about every number while acting like he cares about nothing"}], "vitals": {"height": {"th": "190 cm", "en": "6'3\""}, "frm": {"th": "Los Angeles → สัญญาก้อนโตที่สุดในประวัติ W", "en": "Los Angeles → the biggest contract in W history"}, "style": {"th": "Powerhouse ace · เก็บทุกอย่างไว้ท่าเดียว", "en": "Powerhouse ace · saves everything for one move"}, "debut": {"th": "Season 1 Week 1 — main event ป้องกัน W King", "en": "Season 1 Week 1 — W King defence in the main event"}, "finisher": {"th": "CROWNFALL — flying knee เสยตอนคู่ต่อสู้เพิ่งลุก", "en": "CROWNFALL — a flying knee the instant the opponent gets up"}, "sigs": [{"th": "บังคับกรรมการ/คนดู \"ยอมรับ\" ก่อนกดนับ", "en": "Makes the referee and the crowd \"acknowledge\" before the cover"}, {"th": "Spotlight ส่วนตัวตามทุกก้าว", "en": "A personal spotlight follows every step"}, {"th": "Spear ผ่านโต๊ะพากย์", "en": "Spear through the announce table"}], "entrance": {"th": "ไฟดับทั้งสนามยกเว้น spotlight เดียวที่ตามเขา · เพลงมี choir", "en": "Whole building dark except one spotlight that follows him · choir in the music"}, "catch": {"th": "\"Acknowledge the real face of W.\"", "en": "\"Acknowledge the real face of W.\""}, "theme": {"th": "choir + orchestra + trap drums", "en": "Choir, orchestra, trap drums"}}, "stats": {"flex": 60, "power": 96, "exp": 88, "stam": 90, "tech": 84, "burst": 90, "trick": 82, "mind": 72}, "want": {"th": "ให้คนรักเขาเหมือนที่รัก Daiji — โดยไม่ต้องยอมรับว่าอยากได้", "en": "To be loved the way they love Daiji — without ever admitting he wants it"}, "flaw": {"th": "เกลียดเงาของ Daiji เพราะอยากเป็นแบบนั้นแต่ซื้อไม่ได้", "en": "Hates Daiji's shadow because he wants that and it can't be bought"}, "bit": {"th": "เรียกสายหญิงว่า \"show เปิด\" ออกอากาศทุกสัปดาห์ · ทุกครั้งเสียงโห่ดังกว่าครั้งก่อน", "en": "Calls the women \"the opening act\" on air every week · the boos get louder every time"}, "look": {"th": "190/102 หุ่น Hollywood action star · ผมดำเงาหวีหลัง เคราเฟดเนี้ยบ · ชุดทอง-ดำ แว่นกันแดดทอง นาฬิกาเรือนโต", "en": "6'3\", Hollywood action-star build · slicked black hair, sharp faded beard · gold and black gear, gold sunglasses, oversized watch"}, "voice": {"public": {"th": "ญี่ปุ่นปนอังกฤษแบบจงใจ · ช้า ทุกคำเป็นคำประกาศ", "en": "Deliberately mixes Japanese and English · slow, every line a proclamation"}, "private": {"th": "ถามคนจัดการว่า ratings สัปดาห์นี้เท่าไหร่ ก่อนถามว่าใครบาดเจ็บ", "en": "Asks management for this week's rating before asking who got hurt"}}, "s1": {"th": "👑 W King champion · ประกาศสงคราม ratings กับสายหญิง · Kenzo ถูกส่งมาเช็คเขา", "en": "👑 W King champion · declares a ratings war on the women's division · Kenzo is sent to test him"}, "bio": [{"h": "BOUGHT, NOT LOVED", "p": {"th": "บอร์ดซื้อ Ryusei มาจากอเมริกาด้วยสัญญาก้อนโตที่สุดในประวัติ W เพราะตลาดโลกต้องการหน้าที่พูดอังกฤษได้ เขาครอง W King ตั้งแต่คืนแรก มี spotlight ส่วนตัว และเชื่อจริง ๆ ว่าเขาคือหน้าที่แท้จริงของค่าย สิ่งที่เขาไม่พูดคือเขารู้ว่าถูกซื้อมา ไม่ใช่ถูกรัก และคนที่ถูกรักจริงชื่อ Daiji", "en": "The board bought Ryusei from America on the biggest contract in W history because the global market wanted a face that speaks English. He's held the W King since night one, has his own spotlight, and genuinely believes he's the real face of the company. What he never says out loud: he knows he was bought, not loved — and the man who is actually loved is named Daiji."}}, {"h": "THE OPENING ACT", "p": {"th": "ทุกสัปดาห์เขาเรียกสายหญิงว่า show เปิดของเขาออกอากาศ และทุกสัปดาห์เสียงโห่ดังกว่าครั้งก่อน เขาไม่ได้พูดเพราะเกลียดผู้หญิง เขาพูดเพราะตัวเลขของ THE FACE campaign กำลังแซงตัวเลขของเขา และเขาแคร์ทุกตัวเลขทั้งที่แสดงว่าไม่แคร์อะไรเลย", "en": "Every week he calls the women's division his opening act on live TV, and every week the boos get louder. He doesn't say it because he hates women — he says it because THE FACE campaign's numbers are overtaking his, and he cares about every number while pretending to care about nothing."}}, {"h": "SEASON ONE — THE RATINGS WAR", "p": {"th": "สงคราม ratings ชาย vs หญิงคือเส้นของเขา Sune คือคนเดียวที่ตอบเขาได้บนไมค์ Kenzo คือมือที่บอร์ดส่งมาเช็คว่าเขายังคุ้มค่าสัญญาไหม และ Daiji คือเงาที่เขาต้องเผชิญก่อน W CLIMAX", "en": "The men-versus-women ratings war is his storyline. Sune is the only man who can answer him on the mic, Kenzo is the muscle the board sent to check whether he's still worth the contract, and Daiji is the shadow he has to face before W CLIMAX."}}], "rel": [{"to": "sune", "type": "rival", "note": {"th": "ratings ชาย vs หญิง", "en": "Men vs women ratings"}}, {"to": "daiji", "type": "rival", "note": {"th": "เงาตำนานที่ทาบบัลลังก์", "en": "The legend's shadow over his throne"}}, {"to": "kenzo", "type": "rival", "note": {"th": "มือที่บอร์ดส่งมาเช็ค", "en": "The muscle the board sent to test him"}}, {"to": "shiori-kageyama", "type": "boss", "note": {"th": "สัญญาก้อนโตที่เธอเซ็น", "en": "The contract she signed"}}, {"to": "kaito", "type": "rival", "note": {"th": "เล azy · never answers the question"}, "private": {"th": "กับ Suji เท่านั้นที่พูดเป็นประโยคเต็ม", "en": "Only with Suji does he speak in full sentences"}}, "s1": {"th": "มือของ Ren · อดีตของ Akari · แรงดึงดูดต้องห้ามกับ Suji · ถูกส่งไปเช็ค Ryusei", "en": "Ren's muscle · Akari's ex · forbidden pull with Suji · sent to test Ryusei"}, "bio": [{"h": "ALREADY THERE", "p": {"th": "Kenzo ไม่เคยเดินลง ramp เขาอยู่ตรงนั้นก่อนแล้วเสมอ ยืนที่ทางลง มือในกระเป๋า ยิ้มเฉย ดู Suji โดนรุมโดยไม่ช่วย และเปิดประตูให้ Akari ทุกครั้งที่ office สั่ง เขามาถึง W พร้อม Ren Kageyama ในฐานะ bodyguard และกลายเป็น heel ที่คนเกลียดที่สุด-รักที่สุดพร้อมกันภายในเดือนเดียว", "en": "Kenzo never walks the ramp. He's always already there — at the entrance, hands in his pockets, smiling, watching Suji get swarmed without moving, and opening the door for Akari whenever the office says so. He arrived at W as Ren Kageyama's bodyguard and became the heel people hate most and love most within a month."}}, {"h": "NOT MY PROBLEM", "p": {"th": "ผู้หญิงสองคนมองเขา Akari อดีตรักเป็นพิษที่ยังลุกไหม้ และ Suji ที่เกลียดทุกอย่างที่เขาเป็นแต่ใจทรยศ เขาเลือกไม่ได้ และเลือกไม่เลือก จุดตาย: เขาหวงของ — วันที่ผู้หญิงที่เขาต้องการหันไปหาคนอื่น เขาจะทำลายทุกอย่าง", "en": "Two women look at him: Akari, the toxic ex still burning, and Suji, who hates everything he is and can't help it. He can't choose, so he chooses not to. His flaw is possession — the day a woman he wants turns to someone else, he burns everything down."}}, {"h": "SEASON ONE — THE DOOR", "p": {"th": "บอร์ดส่งเขาไปเช็ค Ryusei ว่ายังคุ้มสัญญาไหม และกลางซีซั่นเขาต้องเลือกระหว่างเปิดประตูให้ Akari กับปิดประตูใส่ Suji — ไม่ว่าเลือกทางไหน จะมีคนถูกทำร้ายเพราะเขา", "en": "The board sends him to test whether Ryusei is still worth the contract, and mid-season he has to choose between opening the door for Akari and closing it on Suji — whichever way he goes, someone gets hurt because of him."}}], "rel": [{"to": "suji", "type": "love", "note": {"th": "แรงดึงดูดต้องห้าม", ae by her nickname"}}, "s1": {"th": "ผู้ช่วย / แฟนลับของ Dahae · Ren คือคู่แข่งที่เขาสู้ไม่ได้", "en": "Dahae's assistant and secret boyfriend · Ren is the rival he can't fight"}, "bio": [{"h": "THE ASSISTANT", "p": {"th": "Teddy ตามมาจาก Seoul ในตำแหน่งผู้ช่วยส่วนตัว ถือกระเป๋า ถือทิชชู ถือทุกอย่าง และถือความลับที่ใหญ่ที่สุดของ THE FACE: เขาคือแฟนของเธอ บริษัทห้าม (idol ห้ามมีแฟน) และเขาโกหกไม่เป็น — หน้าฟ้องทุกครั้งที่มีคนถาม", "en": "Teddy followed her from Seoul as her personal assistant — carries the bag, the tissues, everything, and THE FACE's biggest secret: he's her boyfriend. The company forbids it (idols don't date), and he can't lie; his face gives it away every time somebody asks."}}, {"h": "THE HIDING SPOT", "p": {"th": "ทุกสัปดาห์ Teddy โผล่จากที่ซ่อนที่ไม่ควรซ่อนได้ ตู้เสื้อผ้า ใต้เวที กล่องพลุ กล้องของ BiBi จับได้ทุกครั้ง และคนดูรักเขาเพราะเขาคือคนเดียวใน show ที่ไม่มีวาระอะไรนอกจากอยากจับมือแฟนกลางสนามสักครั้ง", "en": "Every week Teddy emerges from somewhere nobody could possibly hide — the wardrobe, under the ring, the pyro box. BiBi's camera catches it every time, and the crowd loves him because he's the only person on the show with no agenda beyond holding his girlfriend's hand in the ring, once."}}, {"h": "SEASON ONE — COLLEAGUES", "p": {"th": "sitcom ของซีซั่น: Dahae × Teddy ซ่อนไม่มิด Ren Kageyama จีบเธอต่อหน้าเขา และตอนที่ความลับหลุด คนที่เจ็บที่สุดคือ Teddy ที่ต้องเลือกว่าจะโกหกเพื่อเธอสักครั้งได้มั้ย", "en": "The season's sitcom: Dahae and Teddy, badly hidden. Ren Kageyama courts her right in front of him, and when the secret finally breaks, the one who hurts most is Teddy — who has to decide whether he can tell one lie for her."}}], "rel": [{"to": "min-dahae", "type": "love", "note": {"th": "แฟนลับ", "en": "Secret boyfriend"}}, {"to": "ren-kageyama", "type": "rival", "note": {"th": "คู่แข่งที่สู้ไม่ได้", "en": "The rival he can't fight"}}], "gender": "m", "group_name": {"th": "Men's division", "en": "Men's division"}, "color": "#3b6ea5", "
