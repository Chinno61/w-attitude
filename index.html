o fight until one of them deserves it"}, "flaw": {"th": "ลูกสาว", "en": "His daughter"}, "bit": {"th": "เสียงในลำโพงโทรศัพท์ ทุกคนแข็งค้าง · ลงมาสนามเองปีละครั้ง", "en": "A voice on speakerphone that freezes the room · one ring appearance a year"}, "look": {"th": "ชายวัย 62 สูทดำ · เห็นแต่โทรศัพท์บนโต๊ะ", "en": "62, black suit · mostly you just see the phone on the desk"}, "voice": {"public": {"th": "ประโยคสั้น ช้า ไม่ซ้ำคำ · ไม่เคยขึ้นเสียง", "en": "Short, slow, never repeats himself · never raises his voice"}, "private": {"th": "เรียก Shiori ว่า \"ลูก\" เฉพาะตอนสั่งให้ทำสิ่งที่เธอไม่อยากทำ", "en": "Calls Shiori \"kid\" only when ordering her to do something she hates"}}, "s1": {"th": "เจ้าของ W · สั่งให้ THE FACE ตัดสินที่ W CLIMAX ด้วยคนดู · ไม่รับสาย Ren", "en": "Owner of W · orders THE FACE settled by the fans at W CLIMAX · doesn't take Ren's calls"}, "bio": [{"h": "THE WAREHOUSE", "p": {"th": "สามสิบปีก่อน Reiji จัด show แรกในโกดังที่คนดูสองร้อยคน วันนี้ W stream ทั่วโลกและแข่ง spotlight กับค่ายยักษ์ในตลาดเดียวกัน เขาไม่เคยลืมว่าคนสองร้อยคนนั้นจ่ายเงินสด เขาเชื่อในตัวเลขเพราะตัวเลขไม่เคยโกหกเขา — ต่างจากคน", "en": "Thirty years ago Reiji ran his first show in a warehouse for two hundred people. Today W streams worldwide and fights the giants for the same spotlight, and he has never forgotten that those two hundred paid cash. He trusts numbers because numbers have never lied to him. People have."}}, {"h": "THE PHONE", "p": {"th": "เขาตั้ง Sune เป็น Head of Talent ข้ามหัว Shiori ไม่ใช่เพราะไม่รักลูก แต่เพราะรู้ว่าลูกจะเก่งขึ้นเมื่อมีคนขวาง เขาสั่งให้ THE FACE ตัดสินที่ PPV ด้วยคนดูเพราะคนดูคือคนจ่ายเงิน และเขาไม่รับสาย Ren มาสามปี จุดตายของเขามีชื่อเดียว: Shiori", "en": "He made Sune Head of Talent over Shiori's head not because he doesn't love her, but because he knows she gets sharper with someone in her way. He ordered THE FACE settled by the fans because the fans are the ones paying. He hasn't taken Ren's calls in three years. His one weakness has a name: Shiori."}}, {"h": "SEASON ONE — ONCE A YEAR", "p": {"th": "Reiji ลงมาสนามเองปีละครั้ง และซีซั่นนี้ครั้งนั้นคือคืน W CLIMAX คำถามที่ลูกทั้งสองรอทั้งซีซั่น: เขาลงมาเพื่อใคร", "en": "Reiji comes to the ring once a year, and this season that night is W CLIMAX. The question both his children wait all season to answer: who is he coming down for?"}}], "rel": [{"to": "shiori-kageyama", "type": "boss", "note": {"th": "พ่อ", "en": "Father"}}, {"to": "ren-kageyama", "type": "boss", "note": {"th": "พ่อที่ไม่รับสาย", "en": "The father who doesn't pick up"}}, {"to": "sune", "type": "boss", "note": {"th": "ตั้งข้ามหัวลูกสาว", "en": "Promoted over his daughter"}}, {"to": "daiji", "type": "rival", "note": {"th": "แชมป์คนแรกที่ไม่ได้คุยกันสิบปี", "en": "His first champion; ten years of silence"}}], "kind": "talent", "group_name": {"th": "The Office", "en": "The Office"}, "color": "#a96bd1", "img": "img/reiji-kageyama_face.jpg", "poster": "img/reiji-kageyama_poster.jpg", "hero": true}, {"slug": "shiori-kageyama", "name": "Shiori Kageyama", "thai": "คาเกยามะ ชิโอริ", "group": "power", "gender": "f", "align": {"th": "Heel authority · CEO", "en": "Heel authority · CEO"}, "nick": {"th": "\"Miss Spreadsheet\" (ฉายาจาก Sune)", "en": "\"Miss Spreadsheet\" (courtesy of Sune)"}, "persona": [{"th": "ลูกสาวเจ้าของที่กลับมาพร้อม MBA เพื่อทำให้ W เป็นบริษัทจริง ไม่ใช่โกดังของพ่อ", "en": "The owner's daughter, back with an MBA to turn W into a real company instead of her father's warehouse"}, {"th": "พูด empowerment บนเวที แล้วเล่นเกมเดียวกับพ่อหลังเวที", "en": "Talks empowerment on stage and plays her father's game backstage"}, {"th": "ยิ่งโกรธยิ่งพูดช้า — และ Mai ทำให้เธอพูดเร็วขึ้นได้ในประโยคเดียว", "en": "The angrier she is, the slower she talks — and Mai can make her speed up with a single sentence"}], "vitals": {"height": {"th": "170 cm", "en": "5'7\""}, "frm": {"th": "MBA ต่างประเทศ → CEO ของ W ตอน 31", "en": "MBA abroad → CEO of W at 31"}, "style": {"th": "อำนาจ · กราฟ · ไม่ปล้ำ (จนกว่าจะโดนล EO · picked Dahae by the numbers · released YUE M · signed Ryusei's contract"}, "bio": [{"h": "DADDY'S COMPANY", "p": {"th": "Shiori กลับมาจาก MBA พร้อมแผนทำให้ W เป็นบริษัทจริง ไม่ใช่โกดังของพ่อ เธอเป็น CEO ตอนสามสิบเอ็ด เซ็นสัญญา Ryusei เพื่อตลาดโลก และเรื่องแรกที่พ่อทำคือตั้ง Sune ข้ามหัวเธอ เธอไม่ได้เกลียด Mai ตั้งแต่แรก — เธอเกลียดวันที่คนดูตะโกนชื่อ Mai ทับกราฟของเธอ เพราะพ่อยิ้ม", "en": "Shiori came back from her MBA with a plan to make W a real company instead of her father's warehouse. CEO at thirty-one, she signed Ryusei for the global market, and the first thing her father did was put Sune over her head. She didn't hate Mai at first. She hated the night the crowd chanted Mai's name over her graph — because her father smiled."}}, {"h": "THE NUMBERS DON'T CARE", "p": {"th": "เธอบริหารด้วยกราฟ และกราฟบอกว่า Dahae ขายได้ เธอพูดเรื่อง empowerment บนเวทีทุกสัปดาห์แล้วสั่งแมตช์ลงโทษ Mai ทุกสัปดาห์เหมือนกัน Hana เห็นทุกคำสั่ง จุดตายของเธอชัด: Mai ทำให้เธอเสียฟอร์มต่อหน้ากล้องได้ในประโยคเดียว และ Sune ตั้งชื่อให้จังหวะนั้นแล้ว", "en": "She runs the company off a graph, and the graph says Dahae sells. She gives an empowerment speech every week and books a punishment match for Mai every week. Hana sees every order. Her weakness is plain: Mai can make her lose her composure on camera with one sentence — and Sune has already named the moment."}}, {"h": "SEASON ONE — NUMBERS VS NOISE", "p": {"th": "เส้นหลักของซีซั่นคือเธอ vs เสียงคนดู เธอปล่อย YUE M ใน Week 2 เพื่อจบเรื่อง และนั่นคือจุดเริ่มของเรื่องที่เธอคุมไม่ได้ Ren กลับมาแย่งพ่อ และปลายซีซั่นเธอต้องเลือกระหว่างชนะ Mai กับให้พ่อยอมรับ — ซึ่งไม่ใช่ทางเดียวกัน", "en": "The season's main line is her against the noise. She releases YUE M in Week 2 to end it, and that's where the thing she can't control begins. Ren comes home to fight her for their father, and by the end she has to choose between beating Mai and earning her father's respect — which turn out to be different roads."}}], "rel": [{"to": "reiji-kageyama", "ty e order changes — and it changes every week. Shiori orders one thing, Sune holds up the phone and says the chairman ordered another, and from Week 4 there's Ren too."}}, {"h": "UNLIT", "p": {"th": "บุหรี่ที่ไม่จุดคือสัญญาณว่าเขาอยากออกไปจากห้องนี้ตั้งแต่ก่อนเข้ามา เขาไม่ใช่คนเลว เขาคือคนที่รู้ว่าทุกคนมีราคา และราคาของเขาคือการอยู่รอดจนถึงสัปดาห์หน้า", "en": "The unlit cigarette means he wanted out of the room before he walked in. He isn't a bad man. He's a man who knows everyone has a price, and his is making it to next week."}}, {"h": "SEASON ONE — THE MIDDLE", "p": {"th": "เขาคือคนที่ต้องยืนตรงกลางระหว่างพ่อกับลูกสองคนทั้งซีซั่น และตอนที่ YUE M หลุดจากการควบคุม เขาคือคนแรกที่ต้องหาว่าใครสั่ง", "en": "He spends the season standing between the father and both children, and when YUE M slips the leash he's the first one who has to find out who gave the order."}}], "rel": [{"to": "shiori-kageyama", "type": "boss", "note": {"th": "รับใช้", "en": "Serves"}}, {"to": "sune", "type": "boss", "note": {"th": "รับใช้ (สลับข้าง)", "en": "Serves (switches sides)"}}, {"to": "ren-kageyama", "type": "boss", "note": {"th": "คนสั่งคนที่สาม", "en": "The third person giving orders"}}], "kind": "talent", "group_name": {"th": "The Office", "en": "The Office"}, "color": "#a96bd1", "img": "img/hayato-kanzaki_face.jpg", "poster": "img/hayato-kanzaki_poster.jpg", "hero": true}, {"slug": "hana", "name": "Hana", "thai": "ฮานะ", "group": "power", "gender": "f", "align": {"th": "Face · พยาน", "en": "Face · the witness"}, "nick": {"th": "\"The Intern\"", "en": "\"The Intern\""}, "persona": [{"th": "เด็กฝึกงานที่เคาะประตูผิดเวลาตั้งแต่วันแรก", "en": "The intern who knocked on the wrong door at the wrong time on day one"}, {"th": "คนตัวเล็กในออฟฟิศที่เห็นทุกอย่างและไม่มีใครนับว่าอยู่ในห้อง", "en": "The small person in the office who sees everything and never counts as being in the room"}, {"th": "ตกใจง่าย แต่ไม่หนี", "en": "Startles easily, never runs"}], "vitals": {"height": {"th": "157 cm", "en": d one witness — the one nobody counts as being in the room."}}, {"h": "THE WITNESS", "p": {"th": "เธอไม่ใช่นักปล้ำ ไม่ใช่นักข่าว เธอคือคนที่รู้ทุกอย่างและยังไม่ได้เลือกว่าจะบอกใคร คนดูปกป้องเธอตั้งแต่ Week 1 เพราะเธอคือคนดูที่หลุดเข้าไปในออฟฟิศ", "en": "She isn't a wrestler or a reporter. She's the person who knows everything and hasn't decided who to tell. The crowd has protected her since Week 1, because she's a fan who wandered into the office."}}, {"h": "SEASON ONE — THE FOLDER", "p": {"th": "ปลายซีซั่นแฟ้มในมือ Hana จะเป็นหลักฐานที่พลิกเส้นหลัก และเธอต้องเลือกระหว่างเจ้านายกับสิ่งที่เห็น", "en": "By the end of the season the folder in Hana's hands is the evidence that flips the main story, and she has to choose between her boss and what she saw."}}], "rel": [{"to": "shiori-kageyama", "type": "reports", "note": {"th": "เห็นทุกคำสั่ง", "en": "Sees every order"}}, {"to": "sune", "type": "ally", "note": {"th": "คนเดียวที่เธอถามตรง ๆ", "en": "The one person she asks straight"}}], "kind": "talent", "group_name": {"th": "The Office", "en": "The Office"}, "color": "#a96bd1", "img": "img/hana_face.jpg", "poster": "img/hana_poster.jpg", "hero": true}, {"slug": "rimo", "name": "RIMO", "thai": "ริโมะ", "group": "staff", "gender": "f", "align": {"th": "Tweener · นักข่าวที่มีวาระ", "en": "Tweener · the reporter with an agenda"}, "nick": {"th": "\"RIMO Has a Clip\"", "en": "\"RIMO Has a Clip\""}, "persona": [{"th": "นักข่าวบันเทิงที่ถูกไล่ออกเพราะปล่อย clip — W จ้างวันถัดมา", "en": "An entertainment reporter fired for leaking a clip — W hired her the next day"}, {"th": "มีอำนาจในตึกมากกว่าคนที่ถือเข็มขัด โดยไม่ต้องปล้ำ", "en": "More power in the building than anyone holding a belt, without ever wrestling"}, {"th": "clip เดียวที่คุมไม่ได้คือความรู้สึกต่อแหล่งข่าวของตัวเอง", "en": "The one clip she can't control is how she feels about her own source"}], "vitals": {"height": {"th": "163 cm", "en": "5'4\""}, "frm": {"th": "สถานีบันเทิงที่ไล่เธอออก → W", "en": "The entertainment c นเรื่องจบที่นี่ · ปีละครั้งที่ Reiji ลงมาสนามเอง |\n| **Club Akibahara** | ใต้ดิน · ไม่ออกอากาศ | ห้องใต้ดินของสนาม ไม่มี hard cam ไม่มี sponsor · Oni Reiko ครอง · ไม่มีในกราฟของบริษัท |\n\n## 3. สนาม\n\nผ้าใบขาว เชือกแดง แผงกั้นขาว ramp เหล็ก จอ LED · สัญลักษณ์ของ W คือ **วงแหวนมีเขา** — อยู่บนผ้าใบ แผ่นรองมุม จอ · **กรงนักเต้น** (Cage Dancer stage) อยู่ข้างเวที ไฟชมพู-ทอง — ที่ที่ Mai Ino เต้นมาสามปีก่อนขึ้นปล้ำ · **กล่อง VIP** ชั้นสอง — ที่ที่แชมป์ W Crown นั่งดูโดยไม่ลงมา · **โกดัง** ที่ไม่มีป้าย — ยิมของ Daiji ในตึกที่ W จัด show แรก\n\n## 4. เข็มขัด\n\n| เข็มขัด | สาย | ผู้ครอง | กติกา |\n|---|---|---|---|\n| 👑 **W Crown** | หญิง | Kamiya Rei | เข็มขัดใหญ่ · แชมป์ที่บริษัทประกาศ ไม่เคยลงมาป้องกัน · รางวัลของ THE FACE |\n| 🤴 **W King** | ชาย | Ryusei Kazuma | เข็มขัดใหญ่ · ace ที่บอร์ด import จากอเมริกา · ป้องกันทุกเดือน |\n| 🌹 **Crimson Rose** | หญิง | Tachibana Reira | เข็มขัดรอง · ป้องกันจริงทุกเดือน |\n| 👯 **Tag Crowns** | หญิง | Neon Saints | เข็มขัดคู่ · ครองนานที่สุดในประวัติ |\n| ⛓️ **Queen of Humiliation** | ทุกคน | Madam Karasu | **24/7** — เปลี่ยนมือได้ทุกที่ทุกเวลา ยิ่งอับอายยิ่งดี |\n| 💀 **Underground Queen** | หญิง · ใต้ดิน | Oni Reiko | เปลี่ยนมือได้เฉพาะใน Club Akibahara |\n\n## 5. THE FACE — engine ของซีซั่น 1\n\nบริษัทเปิด campaign **THE FACE**: หน้าของยุคใหม่ — billboard ดีลแบรนด์ และ**สิทธิ์ท้าชิง W Crown** ที่ W CLIMAX\n- **บอร์ดเลือก Min Dahae** — ด้วยกราฟ (Shiori)\n- **คนดูเลือก Mai Ino** — ด้วยเสียง (ทั้งที่เธอไม่ได้อยู่ในรายชื่อ)\n- **Reiji สั่งผ่านโทรศัพท์:** ตัดสินที่ PPV ด้วยคนดู\n\nทั้งซีซั่นคือสงคราม **ตัวเลข vs เสียงคนดู** — และสายชายมีสงครามของตัวเอง: **Ryusei Kazuma** แชมป์ W King เรียกสายหญิงว่า \"show เปิด\" ออกอากาศ **Sune** ตอบบนไมค์ทุกสัปดาห์ และ ratings ต่อ segment คือสนามรบ\n\n## 6. กฎของโลกนี้\n\n1. **เรื่องคือคน ไม่ใช่แมตช์** — คนสู้กันเพราะเกลียด อิจฉา สถานะ ผู้ชาย ผู้หญิง เงิน หรือแย่งซีน ไม่ใช่เพราะอยากรู้ว่าใครเก่งกว่า\n2. **Heat สะสม แล้วค่อยระเบิด** — ทุก feud เดิน 4 ขั้น (แซะ → แซะกลับ → ชนครั้งแรก → payoff) ห้ามข้ามขั้น\n3. **Finish สกปรก 70%** — run-in, ref bump, ไฟดับ · แมตช์สะอาดเก็บไว้ให้ moment ที่ต้องมีความหมาย\n4. **Face มีตำหนิ Heel มีเหตุผล** — ไม่มีใครใน roster ที่ถูกทั้งหมด · face หลักห้ามแพ้ 2 สัปดาห์ติด · ไม่มีใครแตกสลาย\n5. **ตลกเท่ากับที่ดุ** — ครึ่ง sitcom ครึ่ง street fight · ทุก show มี romance อย่างน้อยหนึ่งเส้นลงสนาม\n6. **อำนาจคือศัตรูอันดับหนึ่ง** — บอร์ด CEO เจ้าของ · และโลกต้องรู้สึกจริง: คนดูจริง ป้ายจริง stream จริง\n7. **กล้องอยู่ทุกที่** — มือถือของ BiBi, clip ของ RIMO, กล้องของ Masa · สิ่งที่ \"ไม่ควรหลุด\" คือ cold open ของสัปดาห์หน้า\n8. **ผู้หญิงถือเสน่ห์ของตัวเอง** — เซ็กซี่คืออำนาจ ไม่ใช่มุม · ระดับ \"สื่อนัย\" ไม่ explicit\n9. **ชายและหญิงคือ main event เท่ากัน** — สลับกันทุกสัปดาห์ และชนกันเมื่อ ratings บังคับ\n10. **ภาษาบนจอคืออังกฤษ** — บทพูดและตัวหนังสือในภาพเป็นอังกฤษ · ไทยคือซับและเสียงบรรยาย\n\n## 7. ปฏิทินซีซั่น 1\n\nW HEAT ทุกวันจันทร์ · **Week 1 = 5 ต.ค. 2026** → Week 8 = 23 พ.ย. · **W CLIMAX = อาทิตย์ 29 พ.ย. 2026** · โครงราย week อยู่ในหน้า Storylines\n", "en": "# W — The World and the Rules\n\n> W is another wrestling promotion in the same world as WWE, TNA and NWA — a Tokyo company fighting the giants for the spotlight and the ratings with the things the giants won't do: women as the lead stars, men as equal main events, and a live show that can't be cut in time.\n\n## 1. The company\n\n**W** was founded thirty years ago by **Reiji Kageyama** with a show in a warehouse in front of two hundred people. Today W streams worldwide every Monday, closes each season with a pay-per-view, and holds the most expensive wrestling contract in Asia. It is still a Kageyama company: **Reiji** (owner — the voice on the phone) · **Shiori** (CEO — the numbers) · **Ren** (the heir who disappeared for three years).\n\nThe business is measured three ways: **ratings** for every W HEAT segment · **Kageyama Points** (the star score the office uses to decide who main-events, who gets the brand deals, who goes on the billboard) · and **the noise in the building** — which the board has no instrument for. That is this season's problem.\n\n## 2. The shows\n\n| Show | When | What it is |\n|---|---|---|\n| **W HEAT** | Live every Monday · two hours | The flagship: 14 segments · five matches (men 2 · women 2 · tag or mixed 1) · promos · backstage · the office · RIMO LIVE · the 24/7 chase · a closer |\n| **W CLIMAX** | Season-ending pay-per-view | Every storyline ends here · the one night a year Reiji comes to the ring |\n| **Club Akibahara** | Underground · never aired | The basement of the arena, no hard cam, no sponsors · ruled by Oni Reiko · not on any company graph |\n\n## 3. The building\n\nWhite canvas, red ropes, white barricades, steel ramp, LED wall · W's mark is the **horned halo** — on the canvas, the corner pads, the screens · the **Cage Dancer stage** beside the ring, lit pink and gold — where Mai Ino danced for three years before she wrestled · the **VIP box** on the second level — where the W Crown champion watches without coming down · the **warehouse** with no sign — Daiji's gym, in the building where W ran its first show.\n\n## 4. Championships\n\n| Title | Division | Holder | Rules |\n|---|---|---|---|\n| 👑 **W Crown** | Women | Kamiya Rei | Top title · a champion the office declared and who has never defended · the prize of THE FACE |\n| 🤴 **W King** | Men | Ryusei Kazuma | Top title · the ace the board imported from America · defended monthly |\n| 🌹 **Crimson Rose** | Women | Tachibana Reira | Secondary title · actually defended every month |\n| 👯 **Tag Crowns** | Women | Neon Saints | Tag titles · the longest reign in W history |\n| ⛓️ **Queen of Humiliation** | Anyone | Madam Karasu | **24/7** — changes hands anywhere, any time, the more humiliating the better |\n| 💀 **Underground Queen** | Women · underground | Oni Reiko | Can only change hands inside Club Akibahara |\n\n## 5. THE FACE — the engine of Season 1\n\nThe company launches **THE FACE**: the face of a new era — the billboard, the brand deals, and a **W Crown title shot** at W CLIMAX.\n- **The board picks Min Dahae** — off a graph (Shiori)\n- **The crowd picks Mai Ino** — with its voice (she wasn't even on the ballot)\n- **Reiji, on the phone:** settle it at the pay-per-view, with the fans\n\nThe whole season is a war of **numbers versus noise** — and the men have a war of their own: **Ryusei Kazuma**, the W King champion, calls the women's division \"the opening act\" on live television, **Sune** answers on the mic every week, and the rating of every segment is the battlefield.\n\n## 6. The rules of this world\n\n1. **The story is people, not matches** — they fight over hate, jealousy, status, men, women, money or the spotlight, never to find out who's better.\n2. **Heat builds, then it explodes** — every feud climbs four rungs (the jab → the jab back → first collision → the payoff). Nobody skips a rung.\n3. **Seventy percent dirty finishes** — run-ins, ref bumps, blackouts · clean finishes are saved for moments that need to mean something.\n4. **Faces have flaws, heels have reasons** — nobody on the roster is entirely right · the top faces never lose two weeks running · nobody breaks.\n5. **As funny as it is violent** — half sitcom, half street fight · every show puts at least one romance line in the ring.\n6. **Power is the number-one enemy** — the board, the CEO, the owner · and the world has to feel real: real fans, real signs, real streams.\n7. **The camera is everywhere** — BiBi's phone, RIMO's clips, Masa's lens · whatever \"shouldn't have leaked\" is next week's cold open.\n8. **Women own their own appeal** — sex appeal is power, not a camera angle · suggestive, never explicit.\n9. **Men and women are equal main events** — they alternate weekly, and collide when the ratings force it.\n10. **The language on screen is English** — dialogue and on-screen text are English · Thai is subtitles and narration.\n\n## 7. Season 1 calendar\n\nW HEAT every Monday · **Week 1 = 5 October 2026** → Week 8 = 23 November · **W CLIMAX = Sunday 29 November 2026** · the week-by-week plan is on the Storylines page.\n"}, "episodes": [{"n": 1, "title": "THE FACE", "meta": "**W HEAT · Week 1 · จันทร์ 5 ตุลาคม 2026 · สด 2 ชั่วโมง · Tokyo W Arena · 9,400 ที่นั่ง เต็ม**", "intro": ["**นาฬิกาของซีซั่น** — จอ LED ขึ้น **W CLIMAX — 55 DAYS** ทุกครั้งที่กลับจากโฆษณา · **billboard THE FACE** ว่างเปล่า มีแค่กรอบทองรอหน้าใครสักคน · สองอย่างนี้อยู่ในเฟรมตลอดซีซั่น", "**สิ่งที่คนดูยังไม่รู้ (สื่อผ่านภาพเท่านั้น)** — Mai ยังเป็น Cage Dancer ไม่เคยปล้ำ · Dahae เซ็นสัญญามา 6 สัปดาห์ ยอด follow 14 ล้าน · Sune คือ top star สายชาย ยังไม่มีตำแหน่งบริหาร · Ryusei ครอง W King 4 เดือน · Rei ครอง W Crown ไม่เคยลงจากกล่อง · Juri นั่งที่นั่ง 1-A ทุก show · Teddy = \"ผู้ช่วยส่วนตัว\" · Akari ยืนหลังเก้าอี้ CEO · YUE M ยังไม่มีในโลกนี้", "**บทเรียนเดียวของตอน (จัดฉาก ไม่พูด)** — *คนดูเลือกได้ และบริษัทเพิ่งรู้ว่าตัวเองไม่มีเครื่องมือวัดมัน*"], "seqs": [{"id": "01", "emoji": "📱", "title": "COLD OPEN — ตู้เสื้อผ้า", "meta": "00:00–00:02 · ทางเดินหลังเวที → ห้องแต่งตัว Dahae · กล้อง: มือถือ BiBi (9:16 กรอบไลฟ์) · เสียงคนดู: LAUGH", "md": "**SHOT 1 · จอดำ**\nไม่มีโลโก้ ไม่มีเพลง เสียงแจ้งเตือนมือถือหนึ่งครั้ง\n\n**SHOT 2 · มือถือ BiBi · ทางเดิน**\nภาพแนวตั้ง กรอบ UI ไลฟ์ **LIVE · 2,318** ภาพสั่นเพราะถือมือ ทางเดินหลังเวที ไฟส้มอุ่นจากห้องแต่งตัวลอดออกมา · **BiBi** ครึ่งเฟรม ผมยาวดำ ชุดเต้นทองเลื่อม ผ้าพันมือขาว ชูมือถือเดินถอยหลังไปตามทางเดิน หัวเราะเอง\n\n**BiBi:** \"Okay okay okay — this one's called the *bell-ring*, you do the hands like— wait— is this live? It's live. Hi. Hi everyone. Okay so—\"\n*(โอเค ๆ ท่านี้ชื่อ bell-ring ทำมือแบบ— เดี๋ยว— นี่ไลฟ์อยู่หรอ ไลฟ์อยู่ สวัสดี ๆ ทุกคน โอเค งั้น—)*\n\n**SHOT 3 · มือถือ BiBi · ประตูห้อง Dahae**\nเธอถอยชนประตูที่มีป้ายกระดาษเขียนมือ **MIN DAHAE** — ประตูเปิดแง้ม กล้องหันเข้าไปโดยไม่ตั้งใจ\n\n**SHOT 4 · มือถือ BiBi · ในห้อง (ผ่านช่องประตู)**\nกระจกไฟดวง ชุดขาว-ทองแขวนในถุงใส · **Dahae** นั่งที่โต๊ะแต่งหน้า ชุดไอดอลขาวขอบทอง — และ **Teddy** ยืนข้างเธอ เสื้อบอมเบอร์ดำ กำลังยื่นทิชชูให้ ก้มลงมาใกล้เกินกว่า \"ผู้ช่วย\" จะยืน · ไม่มีผู้ช่วยคนอื่นในห้อง\n\n**BiBi** (กระซิบใส่กล้อง): \"Wait— wait wait wait. Is that— chat, is that *Teddy*?\"\n*(เดี๋ยว— เดี๋ยว ๆ ๆ นั่น— แชท นั่น Teddy ใช่มั้ย)*\n\n**SHOT 5 · มือถือ BiBi · ตู้เสื้อผ้า**\nDahae ได้ยินเสียง BiBi — **ลุกพรวด** ผลัก Teddy ทั้งตัวเข้าไปในตู้เสื้อผ้าท่ามกลางถุงชุดใส สองมือดันหลังเขา Teddy หัวชนราวแขวน ทิชชูยังอยู่ในมือ · ประตูตู้ปิด\n\n**Dahae** (เร็ว เบา): \"Get in. Get in get in get in—\"\n**Teddy:** \"The tissue— I still have the—\"\n**Dahae:** \"*In.*\"\n*(ดาเฮ: เข้าไป เข้าไป ๆ ๆ / เท็ดดี้: ทิชชู— ผมยังถือ— / ดาเฮ: เข้าไป)*\n\n**SHOT 6 · มือถือ BiBi · Dahae หันมา**\nDahae หันมาช้า ๆ ยิ้มไอดอลค้างเต็มหน้าเหมือนไม่มีอะไรเกิดขึ้น — ตาไม่ยิ้ม · watching วิ่ง 2,318 → 4,900 → 11,000 ในสามวินาที comment ไหลเป็นน้ำตก\n\n**Dahae:** \"BiBi. Sweetie. Turn it off.\"\n*(BiBi จ๊ะ ปิดเถอะ)*\n**BiBi:** \"I don't know how—\"\n*(ไม่รู้วิธี—)*\n**Teddy** (จากในตู้ อู้อี้): \"...It was a tissue.\"\n*(...มันคือทิชชู)*\n\n**SHOT 7 · ตัดดำ → พลุ**\nพลุระเบิดเต็มจอ เพลงเปิด W HEAT โลโก้วงแหวนมีเขาสว่างวาบบนจอ stage เหนือ ramp ขาว\n\n**SHOT 8 · crane · ข้ามหัวคนดู**\ncrane กวาดจากแถวหลังข้ามหัวคนดูเก้าพันคนที่ยืนอยู่แล้ว ลงไปหาเวทีขาวกลางสนาม · ป้ายผ่านหน้ากล้อง: **MAI FOR THE FACE** · **TEDDY WE SEE YOU** · **SUNE HAS NO THIRD THING**\n\n**Kenji** (V.O.): \"GOOD EVENING, and welcome to W HEAT — nine thousand four hundred in this building tonight, and every single one of them just saw the same thing we did—\"\n**Dex:** \"A man went *into* a closet, Kenji. That's all I'm saying. A man. A closet. A tissue.\"\n**Kenji:** \"It's Monday night. Anything can happen. Fifty-five days to W CLIMAX, and tonight — the company names THE FACE.\"\n*(เคนจิ: สวัสดี W HEAT คืนนี้เก้าพันสี่ร้อยคน และทุกคนเพิ่งเห็นสิ่งเดียวกับเรา— / เด็กซ์: ผู้ชายเข้าไปในตู้ เคนจิ ผมพูดแค่นี้ ผู้ชาย ตู้ ทิชชู / เคนจิ: คืนวันจันทร์ อะไรก็เกิดขึ้นได้ อีก 55 วันถึง W CLIMAX และคืนนี้บริษัทประกาศ THE FACE)*", "stills": [{"key": "seq01_s02", "shot": 2, "to": null, "cap": "BiBi ชูมือถือไลฟ์ ไฟอุ่น → **เฟรมจากฟุต** `S03@9.5`", "kind": "video", "img": "ep/ep01_seq01_s02.jpg"}, {"key": "seq01_s04", "shot": 4, "to": null, "cap": "Teddy ยื่นทิชชูให้ Dahae ที่โต๊ะแต่งหน้า → **เฟรมจากฟุต** `S16@13.5`", "kind": "video", "img": "ep/ep01_seq01_s04.jpg"}, {"key": "seq01_s05", "shot": 5, "to": null, "cap": "Dahae ดัน Teddy เข้าตู้ สองมือบนหลัง → **เฟรมจากฟุต** `S17@10.75`", "kind": "video", "img": "ep/ep01_seq01_s05.jpg"}, {"key": "seq01_s06", "shot": 6, "to": null, "cap": "CU Dahae ยิ้มค้าง ตาไม่ยิ้ม → **เฟรมจากฟุต** `S03@8.6`", "kind": "video", "img": "ep/ep01_seq01_s06.jpg"}, {"key": "seq01_s07", "shot": 7, "to": null, "cap": "พลุเต็ม stage โลโก้สว่าง → **เฟรมจากฟุต** `S04@0.5`", "kind": "video", "img": "ep/ep01_seq01_s07.jpg"}, {"key": "seq01_s08", "shot": 8, "to": null, "cap": "crane ข้ามหัวคนดูลงหาเวที → **เฟรมจากฟุต** `S05@17.5`", "kind": "video", "img": "ep/ep01_seq01_s08.jpg"}]}, {"id": "02", "emoji": "🎆", "title": "OPENING PROMO — กราฟ", "meta": "00:02–00:12 · เวที · กล้อง: hard cam / crane / ringside handheld · เสียงคนดู: BOO → POP → LAUGH → HUSH → GASP", "md": "**SHOT 1 · wide · ทางลง**\nเพลงบริษัท สตริงเย็น click เมาส์เป็นจังหวะ ไฟสนามขาวเย็นทั้งหมด **Shiori** เดินออกมา ไม่มองคนดู tablet ในมือ · ตามหลังหนึ่งก้าว **Akari** — ใน**ชุดปล้ำทอง** ไม่ใช่ชุด bodyguard คนดูเห็นก่อนพากย์\n\n**Dex:** \"Kenji — Akari's in gear. Akari Noa is in *ring gear*.\"\n**Kenji:** \"I see it. I don't like it.\"\n*(เด็กซ์: Akari ใส่ชุดปล้ำ / เคนจิ: เห็นแล้ว ไม่ชอบเลย)*\n\n**SHOT 2 · MS · Shiori กลางเวที**\nยกไมค์ รอให้เสียงโห่จบเอง ไม่จบ พูดทับ\n\n**Shiori:** \"Good evening. I'm not going to wait for you to be quiet, because the numbers say you won't be. So.\"\n*(สวัสดี ฉันจะไม่รอให้พวกคุณเงียบ เพราะตัวเลขบอกว่าคุณจะไม่เงียบ ดังนั้น)*\n\n**SHOT 3 · จอใหญ่ · กราฟ**\nเส้นแดงพุ่งขึ้น **+412% · 14.2M · 61% female 18–34**\n\n**Shiori:** \"Six weeks ago we signed one person. Since then, every number in this company has moved in one direction. Merchandise. Streaming. The brand deals that pay for the lights you're sitting under.\"\n*(หกสัปดาห์ก่อนเราเซ็นหนึ่งคน ตั้งแต่นั้นทุกตัวเลขขยับทางเดียว สินค้า สตรีม ดีลแบรนด์ที่จ่ายค่าไฟที่พวกคุณนั่งอยู่ใต้มัน)*\n\n**SHOT 4 · จอใหญ่ · billboard**\nกรอบทองบนผ้าใบขาว รูปค่อย ๆ ปรากฏ: **Min Dahae** ยิ้มไอดอล\n\n**Shiori:** \"The board has named THE FACE of W. The billboard goes up in Shibuya Thursday. The brand deals sign Friday. And at W CLIMAX, THE FACE challenges for the W Crown. Ladies and gentlemen — Min Dahae.\"\n*(บอร์ดเลือก THE FACE แล้ว billboard ขึ้น Shibuya วันพฤหัส ดีลเซ็นวันศุกร์ และที่ W CLIMAX THE FACE จะได้ท้าชิง W Crown — Min Dahae)*\n\n**SHOT 5 · wide · stage**\nเพลงไอดอล ไฟขาว-ชมพู **Dahae** ออกมาบน stage หน้าวงแหวนสว่าง โบกมือทั้งสองฝั่ง ครึ่งสนามร้องท่อนฮุค อีกครึ่งโห่ เธอโบกให้ทั้งสองฝั่งเท่ากัน · **Teddy** โผล่ตามหลังสองก้าว ผ้าขนหนูพาดแขน — เพิ่งออกจากตู้ ยังไม่ทันปัดฝุ่น · คนดูฮาก่อนจะโห่\n\n**SHOT 6 · crane · แถวหลัง → กรง**\nเริ่มจากแถวหลัง ไม่ใช่เสียงโห่ เป็นชื่อ สองพยางค์ จังหวะเดียว **MAI. MAI. MAI. MAI.** · กล้องกวาดไป**กรงนักเต้น** ไฟชมพู-ทอง **Mai** ในชุดเต้นกำลังจะเริ่มท่าเปิด เธอหยุด มองรอบ — ไม่ใช่ท่าแสดง เป็นคนที่ไม่รู้ว่าเกิดอะไรขึ้น · BiBi ข้าง ๆ ชูมือถือทันที\n\n**Kenji:** \"That's— they're not chanting for Dahae.\"\n**Dex:** \"She's not even on the ballot, Kenji! She's a *dancer*!\"\n**Kenji:** \"Tell *them* that.\"\n*(เคนจิ: พวกเขาไม่ได้เรียก Dahae / เด็กซ์: เธอไม่ได้อยู่ในรายชื่อด้วยซ้ำ เธอเป็นนักเต้น! / เคนจิ: ไปบอกพวกเขาสิ)*\n\n**SHOT 7 · CU · Dahae**\nยิ้มค้าง — **หล่นหนึ่งวินาที** — กลับมา\n\n**SHOT 8 · MS · Shiori**\nมองกรง มอง tablet เหมือนหาตัวเลขที่อธิบายเสียงนี้ ไม่มี\n\n**Shiori:** \"That's— very sweet. Mai, thank you. You can go back to—\"\n*(น่ารักมาก Mai ขอบคุณ กลับไปเต้นต่อได้—)*\n\n**SHOT 9 · wide · ทางลง (ไมค์ตัดเข้า)**\nไม่มีเพลง ไม่มีไฟ เสียงผู้ชายจากทางลง สนามระเบิดก่อนเห็นตัว\n\n**Sune** (O.S.): \"Back to what, Shiori? Say it. Say the word.\"\n*(กลับไปทำอะไร Shiori พูดสิ พูดคำนั้น)*\n\n**Sune** เดินออกมา เสื้อยืดขาว ยีนส์ ไม่รีบ ตบมือกับเด็กแถวหน้าคนหนึ่ง ค่อยขึ้นเวที · Akari ขยับเข้าคั่นระหว่างเขากับ Shiori หนึ่งก้าว เขาพยักหน้าทักเหมือนเพื่อน Akari ไม่พยัก\n\n**SHOT 10 · MS · Sune / คนดู**\n**Sune:** \"I've got three things to say.\"\n**คนดูทั้งสนาม:** \"THERE IS NO THIRD!\"\n**Sune** (ยิ้ม ชี้คนดู): \"See, they know. Okay. One. Nine thousand people just told you who THE FACE is. You're holding a tablet. They're holding *the building*.\"\n*(ผมมีเรื่องจะพูดสามข้อ / ไม่มีข้อสาม! / เห็นมั้ย เขารู้ ข้อหนึ่ง เก้าพันคนเพิ่งบอกคุณว่า THE FACE คือใคร คุณถือ tablet พวกเขาถือทั้งตึก)*\n\n**SHOT 11 · two-shot · Sune / Shiori**\n**Shiori:** \"Nine thousand people don't sign brand deals—\"\n**Sune:** \"Two. Two! I'm not done. Two: you didn't pick her. A spreadsheet picked her. And I've decided — right now, tonight — that's your name. Miss Spreadsheet.\"\n*(ชิโอริ: เก้าพันคนไม่ได้เซ็นดีลแบรนด์— / ซูเนะ: ข้อสอง! ยังไม่จบ คุณไม่ได้เลือกเธอ spreadsheet เลือก และผมตัดสินใจแล้ว คืนนี้ นั่นคือชื่อคุณ คุณหนู Spreadsheet)*\n\nShiori พูดช้าลง — ยิ่งโกรธยิ่งช้า\n\n**Shiori:** \"You are a wrestler. You wrestle. You don't get a vote on—\"\n**Sune:** \"Three—\"\n**Shiori:** \"There is no *third*—\"\n\n**SHOT 12 · CU · Shiori (หยุด)**\nเธอหยุด เพราะเพิ่งพูดประโยคของคนดู · ทั้งสนามได้ยิน ระเบิด · Sune ไม่พูด หันไปมอง hard cam ยักไหล่\n\n**SHOT 13 · insert · กรงนักเต้น**\n**Mai หัวเราะออกมาจริง ๆ** — BiBi ถ่ายติด\n\n**SHOT 14 · จอใหญ่ · โต๊ะประชุม**\n**เสียงโทรศัพท์**จากลำโพงสนามทับทุกอย่าง ทั้งสนามเงียบ · จอใหญ่: โต๊ะไม้เข้มว่าง มี **speakerphone** เครื่องเดียว ไฟเขียวกะพริบ\n\n**Reiji** (เรียบ ช้า ไม่ซ้ำคำ): \"Shiori.\"\n**Shiori** (เสียงเปลี่ยน — เด็ก): \"...Father.\"\n**Reiji:** \"Your numbers are correct.\"\n**Shiori:** \"Thank you—\"\n**Reiji:** \"And they can't hear the room. I can. Put the crowd on it.\"\n*(เรจิ: ชิโอริ / ชิโอริ: ...พ่อ / เรจิ: ตัวเลขของลูกถูก / ชิโอริ: ขอบคุณ— / เรจิ: และมันไม่ได้ยินเสียงในห้อง พ่อได้ยิน ให้คนดูตัดสิน)*\n\n**Shiori:** \"Father, with respect, the deals are already—\"\n**Reiji:** \"Sune.\"\n**Sune** (ตัวตรงทันที): \"Sir.\"\n**Reiji:** \"As of tonight you are Head of Talent. You report to me. Not to her.\"\n*(ชิโอริ: พ่อคะ ดีลมันเซ็นแล้ว— / เรจิ: ซูเนะ / ซูเนะ: ครับ / เรจิ: ตั้งแต่คืนนี้คุณคือ Head of Talent รายงานตรงกับผม ไม่ใช่กับเธอ)*\n\n**SHOT 15 · three-shot · Shiori / Akari / Sune**\nShiori ไม่ขยับ Akari มองเธอ · Sune ไม่ยิ้ม — เหมือนคนที่เพิ่งได้ของที่ไม่ได้ขอ\n\n**Reiji:** \"THE FACE will be decided at W CLIMAX. By the people who pay. Both of them will be there. Goodnight.\"\n*(THE FACE ตัดสินที่ W CLIMAX โดยคนที่จ่ายเงิน ทั้งสองคนจะอยู่ที่นั่น ราตรีสวัสดิ์)*\n\nไฟเขียวดับ\n\n**SHOT 16 · MS · Shiori → Sune**\n**Shiori:** \"Both of them. He said *both*. So she wrestles. Tonight.\"\n**Sune:** \"She's a dancer—\"\n**Shiori:** \"You said nine thousand people picked her. Let's see what they picked.\"\n*(ชิโอริ: ทั้งสองคน พ่อบอกว่าทั้งสองคน งั้นเธอปล้ำ คืนนี้ / ซูเนะ: เธอเป็นนักเต้น— / ชิโอริ: คุณบอกว่าเก้าพันคนเลือกเธอ มาดูว่าเลือกอะไรมา)*\n\n**SHOT 17 · wide · Sune คนเดียว**\nShiori ออก Akari ตาม · Sune กลางเวที มองไปที่กรง · Mai มองกลับ · ไม่มีใครพูด\n\n**Dex:** \"He just got promoted and lost the argument in the same sentence.\"\n**Kenji:** \"And Mai Ino is wrestling tonight whether she wants to or not.\"\n*(เด็กซ์: เพิ่งได้เลื่อนตำแหน่งและแพ้การเถียงในประโยคเดียว / เคนจิ: และ Mai Ino จะได้ปล้ำคืนนี้ ไม่ว่าจะอยากหรือไม่)*", "stills": [{"key": "seq02_s03", "shot": 3, "to": null, "cap": "จอ stage กราฟเส้นฟ้าพุ่งขึ้น +412% · 14.2M · 61% ลำแสงทะลุหมอก คนดูเป็นเงาชูมือถือ → **still** (Nano edit จากเฟรมฟุต `S05@14.0`)", "kind": "video", "img": "ep/ep01_seq02_s03.jpg"}, {"key": "seq02_s05", "shot": 5, "to": null, "cap": "Dahae ชูสองแขนโบกบน stage หน้าวงแหวน Teddy ตามหลังถือผ้าขนหนู → **still** (Nano · ชีท Dahae + เฟรมฟุต `S07@8.5` เป็น ref stage)", "kind": "video", "img": "ep/ep01_seq02_s05.jpg"}, {"key": "seq02_s02", "shot": 2, "to": null, "cap": "CU Shiori ยกไมค์ รอเสียงโห่ ไม่จบ → **เฟรมจากฟุต** `S10@1.5`", "kind": "video", "img": "ep/ep01_seq02_s02.jpg"}, {"key": "seq02_s06", "shot": 6, "to": null, "cap": "Mai ในกรง มือแตะอก หยุดกลางท่า มองออกมา — ไม่ใช่ท่าแสดง → **เฟรมจากฟุต** `D Mai Dance/D-2@0.5`", "kind": "video", "img": "ep/ep01_seq02_s06.jpg"}, {"key": "seq02_s10", "shot": 10, "to": null, "cap": "Sune ชี้คนดู \"THERE IS NO THIRD\" ทั้งสนามตะโกนกลับ → **still** (Nano · `v6/sune_B` + `loc_W_arena`)", "kind": "still", "img": "ep/ep01_seq02_s10.jpg"}, {"key": "seq02_s12", "shot": 12, "to": null, "cap": "CU Shiori หยุด — เพิ่งพูดประโยคของคนดู → **เฟรมจากฟุต** `S08@9.5`", "kind": "video", "img": "ep/ep01_seq02_s12.jpg"}, {"key": "seq02_s07", "shot": 7, "to": null, "cap": "CU Dahae ยิ้มหล่น หน้านิ่งหนึ่งวินาที → **เฟรมจากฟุต** `S03@8.0`", "kind": "video", "img": "ep/ep01_seq02_s07.jpg"}, {"key": "seq02_s13", "shot": 13, "to": null, "cap": "Mai ในกรง มือเท้าเอว ยิ้มออกมาจริง ๆ → **เฟรมจากฟุต** `D-2-1@7.0`", "kind": "video", "img": "ep/ep01_seq02_s13.jpg"}, {"key": "seq02_s14", "shot": 14, "to": null, "cap": "โต๊ะประชุม speakerphone ไฟเขียว ไม่มีคน → **still** ทำเป็น element ใช้ทั้งซีซั่น", "kind": "still", "img": "ep/ep01_seq02_s14.jpg"}, {"key": "seq02_s17", "shot": 17, "to": null, "cap": "Sune คนเดียวกลางเวที มองกรง → **still** (`v6/sune_B` + `loc_W_arena_master`)", "kind": "still", "img": "ep/ep01_seq02_s17.jpg"}]}, {"id": "03", "emoji": "🥊", "title": "MATCH 1 — Mai Ino vs Roxy Lane", "meta": "00:12–00:20 · หลังเวที → เวที · กล้อง: handheld follow / hard cam / ringside · เสียงคนดู: POP → HUSH → POP → BOO → GASP → POP", "md": "**SHOT 1 · handheld · ทางเดิน → กรง**\nจอ **W CLIMAX — 55 DAYS** · **Hayato** สูทเทา บุหรี่ไม่จุด เดินเร็วไปที่กรงนักเต้น กระดาษแผ่นเดียวในมือ\n\n**Hayato:** \"Ino. Mai Ino. You have— eleven minutes. Do you own boots?\"\n**Mai:** \"I— dance boots?\"\n**Hayato:** \"Do they lace?\"\n**Mai:** \"...Yes?\"\n**Hayato:** \"Then they're wrestling boots. Eleven minutes.\"\n*(ฮายาโตะ: อิโนะ มี— สิบเอ็ดนาที มี boots มั้ย / มาอิ: boots เต้น? / ฮายาโตะ: มีเชือกมั้ย / มาอิ: ...มี? / ฮายาโตะ: งั้นมันคือ boots ปล้ำ สิบเอ็ดนาที)*\n\n*(insert · ห้องแต่งตัว Mai — กระจกไฟดวง ชุดแดงแขวนข้างหลัง — Mai นั่งบนสตูลแดง ก้มผูกเชือก boots ขาวทีละรู มือสั่นนิดเดียว BiBi ถ่ายอยู่ห่าง ๆ ไม่พูด)*\n\nเดินไป หันกลับ\n\n**Hayato:** \"Everyone has a price, kid. Yours just got set. Don't die.\"\n*(ทุกคนมีราคา ราคาของเธอเพิ่งถูกตั้ง อย่าตาย)*\n\n**SHOT 2 · MS · Jin**\nไมค์ทอง ยืดทุกสระ\n\n**Jin:** \"The following contest— is scheduled for ONE fall— and is the FIRST. EVER. MATCH— of a woman who was not supposed to be here tonight—\"\n*(แมตช์ต่อไป ตัดสินด้วยกดนับหนึ่งครั้ง และเป็นแมตช์แรกในชีวิตของผู้หญิงที่ไม่ควรอยู่ตรงนี้คืนนี้—)*\n\n**SHOT 3 · wide · entrance THE STANDARD**\nเฮาส์เย็น ๆ · **Tasha** เดิน runway ถือป้าย · **Roxy** ปากขยับด่าคนดูตลอด ramp · **Kanna** หลังสุดถือป้ายทั้งกอง\n\n**SHOT 4 · MS · Roxy ในเวที**\nยกไมค์ก่อนกรรมการ\n\n**Roxy:** \"I was here first. Three years in that cage. Three! Before Osaka showed up with her— *hair*. And now she's THE FACE? She's not THE FACE. She's *a* face. I've seen it. Up close. It's fine.\"\n*(ฉันมาก่อน สามปีในกรงนั่น ก่อนยัยโอซาก้าจะโผล่มาพร้อม— ผม แล้วตอนนี้เป็น THE FACE? ไม่ใช่ THE FACE เป็นแค่หน้าหนึ่งหน้า ฉันเคยเห็นใกล้ ๆ ก็โอเคแหละ)*\n\n**SHOT 5 · insert · Tasha ข้างเวที**\nชูป้าย **6** ให้ Roxy · Roxy หันมามอง · Tasha ไม่เปลี่ยน · คนดูฮา\n\n**SHOT 6 · wide → low angle · entrance Mai**\n**ไฟดับ** spotlight ชมพูที่กรง synth K-POP คนดูร้องท่อนฮุคก่อนเพลงจะถึง · **Mai** ก้าวออกจากกรงในชุด**แดง metallic ขอบขาว**ที่ไม่มีใครเคยเห็น — เธอเตรียมไว้นานแล้ว · เดินลง ramp **ไม่มองกล้อง** จนถึงเชือก หันมา ขยิบตาให้ hard cam\n\n**Kenji:** \"She had the gear. Dex — she had the gear *ready*.\"\n**Dex:** \"Okay that's— okay. That's a good entrance. I'm not gonna lie.\"\n*(เคนจิ: เธอมีชุดอยู่แล้ว เตรียมไว้แล้ว / เด็กซ์: โอเค entrance ดี ไม่โกหก)*\n\n**SHOT 7 · insert · ที่นั่ง 1-A**\nผู้หญิงหางม้าสูง ป้ายกลิตเตอร์ **MAI** กระโดดจนป้ายสั่น — **Juri** — ยังไม่มีชื่อบนจอ\n\n**SHOT 8 · hard cam · เปิดแมตช์**\nกระดิ่ง · Roxy พุ่งใส่ ดึงผมลากเข้ามุม · Mai รับเต็ม ๆ สามครั้ง ไม่รู้จะทำอะไร คนดูเงียบลง — Roxy ทำผิด: หยุดพูดกับกล้อง\n\n**Roxy:** \"THIS is THE FACE—\"\n\n**SHOT 9 · ringside low · Cage Kick**\nMai เตะจากเชือกเส้นบน — ท่าที่ทำในกรงทุกคืนมาสามปี แต่คราวนี้มีคนอยู่ปลายเท้า · Roxy ล้ม · สนามระเบิด · Mai ยืนงงกับเสียงตัวเองครึ่งวินาที แล้วยิ้ม\n\n**SHOT 10 · hard cam · brawl**\nไม่สวย ไม่มีท่า ตบ ดึงผม ฟาดเข้ามุม โยนออกนอกเวที · Roxy เก่งกว่าชัด แต่ทุกครั้งที่ได้เปรียบเธอหยุดพูด Mai ได้จังหวะคืน\n\n**Dex:** \"Roxy — stop *talking* — she's— Roxy!\"\n\n**SHOT 11 · wide · Mai บนเชือก / Akari ลง ramp**\nนาทีหก Mai ขึ้นเชือกเส้นบน หันหลังให้เวที — ท่าที่ไม่มีใครเคยเห็น — Kenji ยืนขึ้น — **เบสหนักเดินทหาร** · **Akari** เดินลง ramp ไม่มีไฟ ไม่รีบ\n\n**Kenji:** \"No. No— this isn't her match! THIS ISN'T HER MATCH!\"\n\n**SHOT 12 · hard cam · การแทรก**\nAkari ขึ้น apron · **Gen** หันไปห้าม · Roxy ดึงขา Mai ตกจากเชือก · Akari ข้ามเชือก ยก Mai กลางอากาศ gorilla press **โยนออกนอกเวที**ทับแผงกั้น\n\n**SHOT 13 · MS · Akari กลางเวที**\nGen เรียก DQ · Jin: \"The winner by disqualification— MAI INO—\" ไม่มีใครฟัง · Akari มอง Mai ที่พยายามลุก · ก้มลง ดึง**ปลอกแขนแดง**ข้างหนึ่งออก ถือให้กล้อง ทิ้งลงพื้น — \"ฉีกหน้ากาก\" ครั้งแรก\n\n**Akari:** \"Say 'dancer' one more time.\"\n*(พูดคำว่า \"นักเต้น\" อีกครั้งสิ)*\n\n**SHOT 14 · ringside · รุม / Juri ข้ามแผงกั้น**\nRoxy กับ Kanna เข้ารุม กล้องอยู่ที่พื้น — **เสียงกระโดดข้ามแผงกั้น** · **Juri** โดดข้ามทั้งตัว ป้ายกลิตเตอร์ยังอยู่ในมือ พุ่งใส่ Kanna จากข้างหลัง ไม่มีท่า มีแต่น้ำหนัก · การ์ดวิ่งมา Tasha ชูป้าย **0** ให้ Juri · Juri ไม่เห็น เธอกำลังคลุมตัว Mai\n\n**Dex:** \"A FAN just— who is that? Security! Kenji, a *fan* just—\"\n**Kenji:** \"I don't know who she is. But she's the only one in this building who moved.\"\n*(เด็กซ์: แฟนคลับเพิ่ง— นั่นใคร / เคนจิ: ไม่รู้ว่าเป็นใคร แต่เธอเป็นคนเดียวในตึกนี้ที่ขยับ)*\n\n**SHOT 15 · MS · Akari ออก**\nมองลงมา มอง Juri ครึ่งวินาที · เดินขึ้น ramp เฉย ๆ — งานเสร็จแล้ว", "stills": [{"ke **\nKaito มอง Sune · Sune ยกมือทักเป็นมิตร · Kaito ไม่ยก\n\n**Kaito** (กับ Mai แต่มอง Sune): \"He's Head of Talent now.\"\n**Mai:** \"I heard.\"\n**Kaito:** \"So he decides who you fight.\"\n**Sune:** \"Actually the CEO just—\"\n**Kaito:** \"I wasn't talking to you.\"\n*(ไคโตะ: เขาเป็น Head of Talent แล้ว / มาอิ: ได้ยินแล้ว / ไคโตะ: งั้นเขาตัดสินว่าเธอสู้กับใคร / ซูเนะ: จริง ๆ CEO เพิ่ง— / ไคโตะ: ผมไม่ได้คุยกับคุณ)*\n\nเงียบ · BiBi ยกมือถือถ่ายช้า ๆ · Mai กดมือ BiBi ลง\n\n**SHOT 5 · MS · Mai / Kaito**\n**Mai:** \"Kaito. You have a match. Go.\"\n**Kaito:** \"Against Kenzo.\"\n**Mai:** \"I know.\"\n**Kaito:** \"He's— you saw what Akari—\"\n**Mai:** \"Go win. I'll watch.\"\n*(มาอิ: นายมีแมตช์ ไป / ไคโตะ: กับ Kenzo / มาอิ: รู้ / ไคโตะ: เขา— เธอเห็นที่ Akari— / มาอิ: ไปชนะ ฉันจะดู)*\n\nเดินไป หันกลับ ยื่นโปสเตอร์ให้\n\n**Kaito:** \"Here. It's yours.\"\n*(นี่ ของเธอ)*\n\n**SHOT 6 · two-shot · Mai / Sune**\nMai ถือโปสเตอร์ตัวเอง · Sune มองโปสเตอร์ มอง Mai\n\n**Sune:** \"He seems nice.\"\n**Mai:** \"Don't.\"\n**Sune:** \"I didn't say anything.\"\n**Mai:** \"You were about to say three things.\"\n*(ซูเนะ: เขาดูนิสัยดี / มาอิ: อย่า / ซูเนะ: ไม่ได้พูดอะไร / มาอิ: คุณกำลังจะพูดสามข้อ)*\n\nBiBi หัวเราะดังมาก · ตัดโฆษณา", "stills": [{"key": "seq04_s01", "shot": 1, "to": null, "cap": "Kaito ชูโปสเตอร์ MAI INO บังครึ่งหน้าตัวเอง ทางเดินหลังเวที เด็กแฟนคลับถ่ายอยู่ข้าง ๆ → **เฟรมจากฟุต** `S13@17.5`", "kind": "video", "img": "ep/ep01_seq04_s01.jpg"}, {"key": "seq04_s06", "shot": 6, "to": null, "cap": "Mai ถือโปสเตอร์ตัวเอง ปลอกแขนข้างเดียว Sune ข้าง ๆ มองโปสเตอร์ → **still** (`v10/mai-ino` + `v6/sune_B`) — ภาพสามเหลี่ยม Mai/Sune/Kaito ใบแรกของซีซั่น", "kind": "still", "img": ""}]}, {"id": "05", "emoji": "🥊", "title": "MATCH 2 — Kaito vs Kenzo", "meta": "00:23–00:33 · เวที · เสียงคนดู: POP → GASP → UNEASE → BOO", "md": "**SHOT 1 · wide · entrance Kaito**\nจอ **55 DAYS** · rock สดใส **Kaito** วิ่งลง ramp ตบมือทุกคน — คนดูรักเขาจริง แต่ป้ายเขียน **MAI'S BOYFRIEND** — เขาเห็น ยิ้มฝืน ตบมือต่อ\n\n**Kenji:** \"Kaito — Daiji's warehouse, same school as Sune — the crowd loves this kid.\"\n**Dex:** \"The crowd loves his *girlfriend*, Kenji. Read the signs.\"\n*(เคนจิ: โกดังของ Daiji โรงเรียนเดียวกับ Sune คนดูรักเด็กคนนี้ / เด็กซ์: คนดูรักแฟนเขา อ่านป้ายสิ)*\n\n**SHOT 2 · wide · ทางลง (Kenzo อยู่แล้ว)**\nไม่มีเพลง · กล้องตัดไป**ทางลง** และเขายืนอยู่ตรงนั้นแล้ว มือในกระเป๋า สูทดำ · ถอดสูทวางบนแผงกั้น ข้างล่างคือกางเกงดำลายมังกรทอง · เดินขึ้นเวทีเหมือนเดินเข้าร้านกาแฟ\n\n**Dex:** \"He's been standing there the whole time?\"\n**Kenji:** \"He's always been standing there. That's the problem with Kenzo.\"\n*(เด็กซ์: ยืนอยู่ตรงนั้นตลอดหรอ / เคนจิ: เขายืนอยู่ตรงนั้นเสมอ นั่นแหละปัญหาของ Kenzo)*\n\n**SHOT 3 · hard cam · dropkick ×2**\nกระดิ่ง · Kaito เร็วกว่า สวยกว่า — dropkick ระดับ poster สองครั้ง คนดูขึ้น · Kenzo รับทั้งสอง ลุก ปัดฝุ่น ยิ้ม\n\n**SHOT 4 · ringside · ศอก**\nครั้งที่สาม Kenzo ไม่รับ — หลบครึ่งก้าว **ศอก**เข้าขากรรไกร — ไม่ใช่ท่าปล้ำ เป็นศอกแบบคนตีกันหลังบาร์ · Kaito ล้มเหมือนไฟดับ\n\n**Kenji:** \"That's not a wrestling move.\"\n**Dex:** \"It's a *winning* move.\"\n\n**SHOT 5 · MS Kenzo ที่เชือก → wide ทางลง**\nKenzo ไม่กดนับ เดินไปที่เชือก มองไปที่ทางลง — กล้องตาม — **Suji** ยืนอยู่ ชุดลายทาง ยังไม่ถึงคิว มาดู · เขามองเธอ เธอมองเขา นานเกินหนึ่งวินาที · Kenzo ยิ้มเฉย · Suji หันหลังกลับเข้าไป\n\n**Dex:** \"What was that?\"\n**Kenji:** \"I don't know. I don't think *they* know.\"\n*(เด็กซ์: นั่นอะไร / เคนจิ: ไม่รู้ ผมว่าพวกเขาเองก็ไม่รู้)*\n\n**SHOT 6 · hard cam · Dragon's Due**\nKaito ลุก ตั้งท่า · Kenzo หันมา ตบซี่โครงสองที ยกขึ้น two-hand choke lift ทุ่ม sit-out · หนึ่ง สอง สาม · แปดนาทีพอดี\n\n**SHOT 7 · wide · Kenzo ออก**\nไม่ฉลอง หยิบสูทจากแผงกั้น ใส่ทับกางเกงปล้ำ เดินขึ้น ramp **มือกลับเข้ากระเป๋า**\n\n**Kenji:** \"He didn't even look back.\"\n**Dex:** \"Why would he? Not his problem.\"\n\n**SHOT 8 · Kaito พิงเชือก → กรง**\nKaito นั่งพิงเชือก — และ**กรงนักเต้น** Mai ยืนดู ปลอกแขนข้างเดียว โปสเตอร์ตัวเองในมือ · เธอสัญญาว่าจะดู เธอดู · Kaito มองไปที่กรง เห็นโปสเตอร์ในมือเธอ หันหน้าหนี", "stills": [{"key": "seq05_s02", "shot": 2, "to": null, "cap": "ทางลงว่าง ไฟแดง Kenzo ยืนพิงกำแพงมือในกระเป๋า ก่อนเพลงใครจะขึ้น → **still** (`v8/kenzo` + `loc_W_ramp`)", "kind": "still", "img": ""}, {"key": "seq05_s04", "shot": 4, "to": 5, "cap": "ศอก → เดินไปเชือก → มอง Suji → Suji หันหลัง → **Seedance 2.0 15 วิ** (STATE MAP Kaito ยืน→ล้ม) ดึงเฟรม S5 two-shot ระยะไกล", "kind": "video", "img": ""}, {"key": "seq05_s08", "shot": 8, "to": null, "cap": "Mai ในกรง ยืนนิ่ง มองลงมาที่เวที ผมยังปลิวจากท่าที่หยุดกลางคัน → **เฟรมจากฟุต** `D-2-1@5.0`", "kind": "video", "img": "ep/ep01_seq05_s08.jpg"}]}, {"id": "06", "emoji": "🏢", "title": "OFFICE — คำสั่ง", "meta": "00:33–00:36 · ห้อง CEO ชั้นสาม · กล้อง: นิ่ง / two-shot · เสียงคนดู: HUSH ทั้ง sequence (ไม่มีคนดูในฉาก)", "md": "**SHOT 1 · wide · ห้อง**\nผนังกระจกมองลงสนาม แสง LED สะท้อนโต๊ะ · **Shiori** หลังโต๊ะ tablet **คว่ำ** — ครั้งแรก · **Hayato** หน้าโต๊ะ บุหรี่ไม่จุด · **Akari** ข้างประตู กอดอก · **ปลอกแขนแดง**ของ Mai บนโต๊ะข้าง tablet\n\n**Shiori:** \"He said 'both'. Fine. Both. She wants to be a wrestler — she wrestles. Every week.\"\n**Hayato:** \"She has no—\"\n**Shiori:** \"Every week, Hayato. You will find her a match every Monday until W CLIMAX. And it will not be an easy one.\"\n*(ชิโอริ: พ่อบอกว่า \"ทั้งสองคน\" ได้ เธออยากเป็นนักปล้ำ — เธอปล้ำ ทุกสัปดาห์ / ฮายาโตะ: เธอไม่มี— / ชิโอริ: ทุกสัปดาห์ หาคู่ให้เธอทุกวันจันทร์จนถึง W CLIMAX และมันจะไม่ง่าย)*\n\n**SHOT 2 · two-shot · Hayato / Shiori**\n**Hayato:** \"Sune's Head of Talent now. He'll—\"\n**Shiori:** \"Sune reports to my father. My father is a phone. I'm the one in the building. Book it.\"\n*(ฮายาโตะ: Sune เป็น Head of Talent แล้ว— / ชิโอริ: Sune รายงานกับพ่อ พ่อคือโทรศัพท์ ฉันคือคนที่อยู่ในตึก จัดซะ)*\n\nHayato มองบุหรี่ เหมือนอยากจุดจริง ๆ\n\n**Hayato:** \"Tonight?\"\n**Shiori:** \"Tonight. Main event. Her—\" พยักไป Akari \"—versus her.\"\n**Hayato:** \"Akari's not— she's not on the roster, she's your—\"\n**Shio function radar(c,size=300){
  const axes=DATA.axes[c.kind]; const n=axes.length, cx=size/2, cy=size/2, R=size*0.36;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let g="";
  for(const f of [0.25,0.5,0.75,1]){g+=`<polygon points="${axes.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="${f===1?'#1d1a1f':'none'}" stroke="#3a343c" stroke-width="1"/>`;}
  g+=axes.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="#3a343c"/>`).join("");
  g+=`<polygon points="${axes.map(([k],i)=>pt(i,R*c.stats[k]/100).join(",")).join(" ")}" fill="#e01e4a" fill-opacity=".55" stroke="#ff3b6f" stroke-width="2.5"/>`;
  g+=axes.map(([k,lbl],i)=>{const [x,y]=pt(i,R+30);return `<text x="${x}" y="${y-6}" text-anchor="middle" font-family="IBM Plex Mono" font-size="17" font-weight="500" fill="#ff3b6f">${c.stats[k]}</text><text x="${x}" y="${y+10}" text-anchor="middle" font-size="11" fill="#9b929a">${esc(t(lbl))}</text>`;}).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(c.name)} ratings" style="font-family:var(--body)">${g}</svg>`;
}

/* ---------- relationship state at week N (0 = start) */
function relState(week){
  const m=new Map();
  for(const c of DATA.characters) for(const r of c.rel) m.set(c.slug+"|"+r.to,{a:c.slug,b:r.to,type:r.type,note:r.note,week:0});
  for(const e of DATA.rel_events) if(e.week<=week) m.set(e.a+"|"+e.b,{a:e.a,b:e.b,type:e.type,note:e.note,week:e.week});
  return [...m.values()];
}

let relWeek=0, relFocus="all";
function relationships(){
  const wl=relWeek===0?u("start"):(relWeek===9?t(DATA.season.ppv):"Week "+relWeek);
  const date=relWeek===0?DATA.season.start:(relWeek===9?DATA.season.ppv_date:DATA.weeks[relWeek-1].date);
  const opts=[`<option value="all">${u("focus")}</option>`,...DATA.factions.map(f=>`<option value="f:${f.id}" ${relFocus==="f:"+f.id?"selected":""}>${esc(t(f.name))}</option>`),...DATA.lines.map(l=>`<option value="l:${l.id}" ${relFocus==="l:"+l.id?"selected":""}>${l.id} · ${esc(t(l.name))}</option>`)].join("");
  $("#v-relationships").innerHTML=`<div class="sh"><h2>${u("relTitle")}</h2><span class="sub">${u("relSub")}</span></div>
    <div class="chartbar"><span class="wl">${esc(wl)}<small>${fmtDate(date)}</small></span><input id="relrange" type="range" min="0" max="9" value="${relWeek}" aria-label="week"><select id="relfocus">${opts}</select></div>
    <div class="mapwrap"><svg class="graph" id="graph" width="1200" height="760" viewBox="0 0 1200 760"></svg></div>
    <div class="legend">${Object.entries(REL_COLOR).map(([k,v])=>`<span><i style="--lc:${v}"></i>${esc(t(DATA.rel_th[k]))}</span>`).join("")}</div>
    <div class="sh" style="margin-top:20px"><h2 style="font-size:20px">${u("events")}</h2></div><div class="evlist" id="evlist"></div>`;
  $("#relrange").oninput=e=>{relWeek=+e.target.value; relationships();};
  $("#relfocus").onchange=e=>{relFocus=e.target.value; relationships();};
  drawGraph();
}
function drawGraph(){
  const svg=$("#graph"); const W=1200,H=760,cx=W/2,cy=H/2;
  let members=null;
  if(relFocus.startsWith("f:")) members=new Set(DATA.factions.find(f=>f.id===relFocus.slice(2)).members);
  if(relFocus.startsWith("l:")) members=new Set(DATA.lines.find(l=>l.id===relFocus.slice(2)).who);
  const edges=relState(relWeek).filter(e=>byId[e.a]&&byId[e.b]).filter(e=>!members||(members.has(e.a)&&members.has(e.b)));
  const involved=new Set(); edges.forEach(e=>{involved.add(e.a);involved.add(e.b);});
  const nodes=DATA.characters.filter(c=>members?members.has(c.slug):involved.has(c.slug));
  const order=["women","men","power","staff"]; nodes.sort((a,b)=>order.indexOf(a.group)-order.indexOf(b.group));
  const pos={}; const R=Math.min(W,H)/2-90;
  nodes.forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/Math.max(nodes.length,1); pos[c.slug]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)};});
  let g="";
  for(const e of edges){const a=pos[e.a],b=pos[e.b]; if(!a||!b) continue; const mx=(a.x+b.x)/2+(cx-(a.x+b.x)/2)*0.35, my=(a.y+b.y)/2+(cy-(a.y+b.y)/2)*0.35;
    g+=`<path class="edge" data-a="${e.a}" data-b="${e.b}" d="M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}" stroke="${REL_COLOR[e.type]||'#666'}"><title>${esc(byId[e.a].name)} → ${esc(byId[e.b].name)} · ${esc(t(DATA.rel_th[e.type]))}: ${esc(t(e.note))}</title></path>`;}
  for(const c of nodes){const p=pos[c.slug]; const lab=p.x<cx-12?"end":(p.x>cx+12?"start":"middle"); const lx=p.x<cx-12?-30:(p.x>cx+12?30:0); const ly=Math.abs(p.x-cx)<=12?(p.y<cy?-32:44):5;
    g+=`<g class="node" data-slug="${c.slug}" data-node="${c.slug}" transform="translate(${p.x},${p.y})"><clipPath id="cp-${c.slug}"><circle r="22"/></clipPath><circle r="24" stroke="${c.color}"/><image href="${c.img}" x="-22" y="-22" width="44" height="44" clip-path="url(#cp-${c.slug})"/><text x="${lx}" y="${ly}" text-anchor="${lab}" font-size="12" font-weight="600">${esc(c.name)}</text></g>`;}
  svg.innerHTML=g;
  svg.querySelectorAll(".node").forEach(n=>{n.addEventListener("mouseenter",()=>hi(n.dataset.node));n.addEventListener("mouseleave",()=>hi(null));});
  const evs=DATA.rel_events.filter(e=>e.week<=relWeek&&(!members||(members.has(e.a)&&members.has(e.b)))).sort((a,b)=>b.week-a.week);
  $("#evlist").innerHTML=evs.map(e=>`<div><b>${wkLabel(e.week===9?"PPV":e.week)}</b><span class="tag" style="--tc:${REL_COLOR[e.type]||'#666'}">${esc(t(DATA.rel_th[e.type]))}</span><span><a data-go="/superstar/${e.a}" style="text-decoration:underline dotted;cursor:pointer">${esc(byId[e.a].name)}</a> → <a data-go="/superstar/${e.b}" style="text-decoration:underline dotted;cursor:pointer">${esc(byId[e.b].name)}</a> — ${esc(t(e.note))}</span></div>`).join("")||`<div style="color:var(--mut)">—</div>`;
}
function hi(slug){const svg=$("#graph"); if(!svg) return;
  svg.querySelectorAll(".edge").forEach(e=>{const on=!!slug&&(e.dataset.a===slug||e.dataset.b===slug);e.classList.toggle("hot",on);e.classList.toggle("dim",!!slug&&!on);});
  const near=new Set(); if(slug){near.add(slug);svg.querySelectorAll(".edge.hot").forEach(e=>{near.add(e.dataset.a);near.add(e.dataset.b);});}
  svg.querySelectorAll(".node").forEach(n=>n.classList.toggle("dim",!!slug&&!near.has(n.dataset.node)));}

/* ---------- WORLD (tiny markdown) */
function md(src){
  const lines=src.split("\n"); let out="",inTable=false,inPre=false,inList=false,inOl=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  for(let l of lines){
    if(l.startsWith("```")){inPre=!inPre; out+=inPre?"<pre>":"</pre>"; continue;}
    if(inPre){out+=esc(l)+"\n"; continue;}
    if(/^\|/.test(l)){ if(/^\|[\s\-|]+\|$/.test(l)) continue; if(!inTable){out+="<div style='overflow-x:auto'><table>";inTable=true;}
      out+="<tr>"+l.slice(1,-1).split("|").map(x=>`<td>${inline(x.trim())}</td>`).join("")+"</tr>"; continue;}
    else if(inTable){out+="</table></div>";inTable=false;}
    if(/^[-*] /.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${inline(l.replace(/^[-*] /,""))}</li>`; continue;} else if(inList){out+="</ul>";inList=false;}
    if(/^\d+\. /.test(l)){ if(!inOl){out+="<ol>";inOl=true;} out+=`<li>${inline(l.replace(/^\d+\. /,""))}</li>`; continue;} else if(inOl){out+="</ol>";inOl=false;}
    if(l.startsWith("# ")){out+=`<h1 style="font:400 40px/1 var(--display);margin:10px 0 6px;text-transform:uppercase">${inline(l.slice(2))}</h1>`;continue;}
    if(l.startsWith("## ")){out+=`<h2>${inline(l.slice(3))}</h2>`;continue;}
    if(l.startsWith("> ")){out+=`<blockquote>${inline(l.slice(2))}</blockquote>`;continue;}
    if(l.trim()==="") continue;
    out+=`<p>${inline(l)}</p>`;
  }
  if(inTable) out+="</table></div>"; if(inList) out+="</ul>"; if(inOl) out+="</ol>"; return out;
}

/* ---------- EPISODES */
const epByN = Object.fromEntries((DATA.episodes||[]).map(e=>[String(e.n),e]));
const seqLabel = q => q.id==="CL" ? "CLOSER" : "SEQ "+q.id;
function epCard(w){
  const e=epByN[String(w.week)]; const dt=fmtDate(w.date);
  if(!e) return `<div class="epcard soon"><div class="cv"><div class="slate">${w.week==="PPV"?"PPV":"EP "+w.week}</div><div class="dt">${dt}</div></div><div class="b"><h3>${esc(t(w.title))}</h3><div class="m">${esc(t(w.hook))}</div><div class="st"><span>${u("epSoon")}</span></div></div></div>`;
  return `<div class="epcard" data-go="/episode/${e.n}"><div class="cv">${e.cover?`<img loading="lazy" src="${e.cover}" alt="">`:`<div class="slate">EP ${e.n}</div>`}<div class="num">EP ${e.n}</div><div class="dt">${dt}</div></div>
    <div class="b"><h3>${esc(e.title)}</h3><div class="m">${esc(t(w.hook))}</div><div class="st"><span><b>${e.seqs.length}</b> ${u("epSeqs")}</span><span><b>${e.nshots}</b> ${u("epShots")}</span><span><b>${e.nphotos}/${e.nstills}</b> ${u("epStills")}</span><span style="margin-left:auto;color:var(--red2)">${u("epRead")}</span></div></div></div>`;
}
function episodes(){
  $("#v-episodes").innerHTML=`<div class="sh"><h2>${u("epTitle")}</h2><span class="sub">${u("epSub")}</span></div><div class="eplist">${DATA.weeks.map(epCard).join("")}</div>`;
}
/* screenplay markdown -> html */
function figs(list){
  return (list||[]).map(s=>{
    const rng="S"+s.shot+(s.to?"–"+s.to:""); const cap=esc(s.cap).replace(/`([^`]+)`/g,"<code>$1</code>");
    const tg=s.kind==="video"?`<span class="tg v">${u("vframe")}</span>`:`<span class="tg">${u("still")}</span>`;
    if(!s.img) return `<div class="fig pend"><code>${rng}</code><span class="w">${u("pending")}</span><span>${cap}</span></div>`;
    return `<figure class="fig"><img loading="lazy" decoding="async" src="${s.img}" alt="${rng}"><figcaption><code>${rng}</code>${tg}<span>${cap}</span></figcaption></figure>`;
  }).join("");
}
function scr(src,stills){
  const inline=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const byShot={}; (stills||[]).forEach(s=>{(byShot[s.shot]=byShot[s.shot]||[]).push(s);});
  let out="", cur=0;
  const flush=()=>{ if(cur&&byShot[cur]){ out+=figs(byShot[cur]); delete byShot[cur]; } };
  for(const raw of src.split("\n")){
    const l=raw.trim(); if(!l) continue;
    let m;
    if((m=l.match(/^\*\*SHOT (\d+) · (.+?)\*\*$/))){ flush(); cur=+m[1]; out+=`<div class="shot"><span class="n">${m[1]}</span><span>${inline(m[2])}</span></div>`; continue; }
    if((m=l.match(/^\*\((.+)\)\*$/))){ out+=`<p class="gl">${inline(m[1])}</p>`; continue; }
    if((m=l.match(/^\*\*([^*]+?)\*\*\s*(?:\(([^)]*)\))?\s*:\s*(.*)$/))){
      const who=m[1].replace(/:$/,""), how=m[2]?`<small>(${inline(m[2])})</small>`:"", rest=m[3];
      const isCm=/^(Kenji|Dex)\b/.test(who);
      out+=`<p class="dl${isCm?" cm":""}"><span class="who">${inline(who)}${how}</span><span class="en">${inline(rest)}</span></p>`; continue; }
    out+=`<p class="act">${inline(l)}</p>`;
  }
  flush(); Object.keys(byShot).sort((a,b)=>a-b).forEach(k=>{out+=figs(byShot[k]);});
  return out;
}
function frame(s){
  const tag=s.kind==="video"?`<span class="tag v">${u("vframe")}</span>`:`<span class="tag">${u("still")}</span>`;
  const rng="S"+s.shot+(s.to?"–"+s.to:"");
  const im=s.img?`<div class="im"><img loading="lazy" decoding="async" src="${s.img}" alt="">${tag}</div>`
                :`<div class="im"><div class="ph"><div class="k">${rng}</div><div class="w">${u("pending")}</div></div>${tag}</div>`;
  return `<div class="fr">${im}<div class="cap"><code>${rng}</code> ${esc(s.cap).replace(/`([^`]+)`/g,"<code>$1</code>")}</div></div>`;
}
function episode(n){
  const e=epByN[String(n)]; if(!e){ $("#v-episode").innerHTML=`<div class="sh"><h2>${u("notfound")}</h2></div>`; return; }
  const w=DATA.weeks.find(x=>String(x.week)===String(n))||{};
  const rail=e.seqs.map(q=>`<a href="#/episode/${e.n}/${q.id}" data-seq="${q.id}">${q.id==="CL"?"CL":q.id} ${esc(q.title.split(" — ")[0])}</a>`).join("");
  const seqs=e.seqs.map(q=>`<section class="seq" id="seq-${q.id}">
      <div class="sh2"><span class="no">${seqLabel(q)}</span><span class="em">${q.emoji}</span><h2>${esc(q.title)}</h2></div>
      <div class="smeta">${esc(q.meta).replace(/·/g,"<b>·</b>")}</div>
      <div class="scr">${scr(q.md,q.stills)}</div>
    </section>`).join("");
  const tail=e.tail.map(x=>`<h2>${esc(x.h)}</h2>${md(x.md)}`).join("");
  const prev=epByN[String(e.n-1)], next=epByN[String(e.n+1)];
  $("#v-episode").innerHTML=`<div class="ep">
    <div class="hd"><div class="kick">${u("ep")} · W HEAT · Week ${e.n}${w.date?" · "+fmtDate(w.date):""}</div><h1>EP ${e.n} — ${esc(e.title)}</h1><div class="meta">${bb(e.meta)}</div>
      <div class="intro">${e.intro.map(x=>`<div>${bb(x).replace(/\*([^*]+)\*/g,"<i>$1</i>")}</div>`).join("")}</div>
      <div class="meta" style="margin-top:12px;color:#6f666e">${u("epNote")}</div></div>
    <div class="rail">${rail}</div>
    ${seqs}
    <div class="tail world">${tail}</div>
    <div class="epnav">${prev?`<a data-go="/episode/${prev.n}">${u("prevEp")} EP ${prev.n}</a>`:`<a class="dis">${u("prevEp")}</a>`}<a data-go="/episodes">${u("allEp")}</a>${next?`<a data-go="/episode/${next.n}">${u("nextEp")} EP ${next.n}</a>`:`<a class="dis">${u("nextEp")}</a>`}</div>
  </div>`;
  const rl=$("#v-episode .rail"); const secs=[...document.querySelectorAll("#v-episode .seq")];
  const io=new IntersectionObserver(en=>{en.forEach(x=>{if(x.isIntersecting){rl.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.seq===x.target.id.slice(4)));}});},{rootMargin:"-120px 0px -70% 0px"});
  secs.forEach(s=>io.observe(s));
}

/* ---------- lang + router */
const VIEWS=["home","superstars","profile","episodes","episode","storylines","relationships","titles","world"];
function setLang(l){LANG=l; try{localStorage.setItem("wa_lang",l);}catch(e){} document.documentElement.lang=l; renderAll(); route();}
function renderAll(){
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  const navmap={"/":"home","/superstars":"ss","/episodes":"ep","/storylines":"st","/relationships":"rel","/titles":"ti","/world":"wo"};
  document.querySelectorAll(".nav a.l").forEach(a=>a.textContent=u(navmap[a.dataset.go]));
  $("#q").placeholder=u("search");
  $("#foot").innerHTML=`<span>${u("foot1")}</span><span>${u("foot2")}</span>`;
  ticker(); home(); episodes(); storylines(); titles(); $("#worldbody").innerHTML=md(DATA.world[LANG]);
}
function go(path){location.hash="#"+path;}
function route(){
  const p=(location.hash||"#/").slice(1); const seg=p.split("/").filter(Boolean);
  let v="home";
  if(seg[0]==="superstars") v="superstars"; else if(seg[0]==="superstar"&&seg[1]) v="profile";
  else if(seg[0]==="episodes") v="episodes"; else if(seg[0]==="episode"&&seg[1]) v="episode";
  else if(seg[0]==="storylines") v="storylines"; else if(seg[0]==="relationships") v="relationships"; else if(seg[0]==="titles") v="titles"; else if(seg[0]==="world") v="world";
  VIEWS.forEach(x=>$("#v-"+x).hidden=(x!==v));
  const top="/"+(seg[0]==="superstar"?"superstars":seg[0]==="episode"?"episodes":(seg[0]||""));
  document.querySelectorAll(".nav a.l").forEach(a=>a.classList.toggle("on",a.dataset.go===top));
  if(v==="profile") profile(seg[1]); else if(v==="superstars") superstars($("#q").value); else if(v==="relationships") relationships();
  else if(v==="episode"){ const ve=$("#v-episode"); if(ve.dataset.n!==seg[1]||ve.dataset.lang!==LANG){ episode(seg[1]); ve.dataset.n=seg[1]; ve.dataset.lang=LANG; }
    if(seg[2]){ const el=document.getElementById("seq-"+seg[2]); if(el){ window.scrollTo(0,el.getBoundingClientRect().top+window.scrollY-118);} } else window.scrollTo(0,0); }
  else window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const lb=e.target.closest("[data-lang]"); if(lb){setLang(lb.dataset.lang);return;} const el=e.target.closest("[data-go]"); if(el){e.preventDefault(); go(el.dataset.go);}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.go) go(e.target.dataset.go);});
$("#q").addEventListener("input",e=>{if(location.hash.indexOf("#/superstars")!==0) go("/superstars"); superstars(e.target.value);});
window.addEventListener("hashchange",route);
document.documentElement.lang=LANG; renderAll(); route();
</script>
